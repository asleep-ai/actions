name: OpenAI advisory PR review
description: Manual, bounded Responses API review without checkout or execution of PR code.
inputs:
  pr-number:
    description: Open pull request number in the calling repository
    required: true
  model:
    description: Explicit OpenAI API model ID available to your project
    required: true
  openai-api-key:
    description: OpenAI project key with a separately configured budget
    required: true
  github-token:
    description: Read-only token for the calling repository
    required: true
  max-output-tokens:
    description: Output cap (256..16000); not a dollar budget
    default: '4000'
outputs:
  path:
    description: Local markdown report path (untrusted model output)
    value: ${{ steps.review.outputs.path }}
  head-sha:
    description: Reviewed PR head SHA
    value: ${{ steps.review.outputs.head-sha }}
runs:
  using: composite
  steps:
    - id: review
      shell: bash
      env:
        REVIEW_SCRIPT: ${{ github.action_path }}/review.py
        REVIEW_PR_NUMBER: ${{ inputs.pr-number }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: python3 "$REVIEW_SCRIPT"
