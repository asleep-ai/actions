name: Android version bump

# Reusable release cut for an Android app repository whose versions are git
# tags. A person starts it by hand for a merged pull request. The plan job
# computes the next version, checks that the commit passed its checks and
# writes what would be released to the job summary. That is all a run does by
# default: it is a dry run. With dry_run off and the planned version repeated
# in confirm, the tag job follows at once: it tags the commit vX.Y.Z and
# starts the caller's release workflow. Nobody is asked in between. The tag is
# the release: no branch is moved unless the caller names one.
#
# With prerelease set to preview, the same version is planned and checked, and
# the tag is vX.Y.0-preview.N: a preview of the version, which the release
# workflow builds with the release key and publishes as a GitHub pre-release.
# Only a new minor or major version has previews; with bump patch the plan is
# refused.
#
# The caller's contract and every input are in android-ci/README.md.
on:
  workflow_call:
    inputs:
      pr:
        description: >-
          Number of the merged pull request to release; its merge commit is
          tagged. Exactly one of pr and sha is given.
        required: false
        type: string
        default: ''
      sha:
        description: >-
          The exception to pr: id of the commit to release, 7 or more hex
          digits.
        required: false
        type: string
        default: ''
      bump:
        description: >-
          Which part of the last version to raise: patch, minor or major. Not
          read when version is given.
        required: false
        type: string
        default: patch
      version:
        description: >-
          Optional. The exact version to release, X.Y.Z, instead of a bump:
          for a first release that does not start at 0.x, or to skip
          versions. It has to be higher than the last release the commit
          contains and must not be tagged yet.
        required: false
        type: string
        default: ''
      prerelease:
        description: >-
          Optional. Empty, the default, plans the release vX.Y.Z. preview
          plans a preview of that version instead: the tag vX.Y.0-preview.N,
          N one above the previews of X.Y.0 that exist. The version has to be
          a new minor or major version: with bump patch, or a version whose
          patch is not 0, the plan is refused. No other value is accepted.
        required: false
        type: string
        default: ''
      dry_run:
        description: >-
          Plan and check only: nothing is tagged, pushed or started. True by
          default, so a release is a run that turns it off on purpose and
          names the planned version in confirm.
        required: false
        type: boolean
        default: true
      confirm:
        description: >-
          The version the plan is expected to compute, X.Y.Z or vX.Y.Z, as a
          dry run showed it; for a preview the whole name, vX.Y.0-preview.N.
          Required when dry_run is false: the run tags only when the plan
          computes this very version. Not read on a dry run.
        required: false
        type: string
        default: ''
      source-branch:
        description: >-
          The branch releases are cut from; empty means the default branch of
          the repository. The commit has to be in its first-parent history, or,
          for a major version that has a branch release/<major>.x, in that
          branch's. A commit of an open pull request or of an unmerged branch
          is refused.
        required: false
        type: string
        default: ''
      required-checks:
        description: >-
          Names of the checks that must have succeeded on the commit, one per
          line, as the commit's checks list shows them. The default is the
          pull request check and the QA build of the push (android-qa.yml,
          called by a job named qa): android-pr-check.yml leaves the release
          variant of a pushed commit to that build.
        required: false
        type: string
        default: |
          pr-check / result
          qa / built
      main-branch:
        description: >-
          Optional. A branch that is moved to the released commit, as a
          fast-forward, when the release is cut from the source branch. A
          release from a release/<major>.x branch moves no branch. Empty, the
          default, moves no branch: the tag alone is the release.
        required: false
        type: string
        default: ''
      release-workflow:
        description: >-
          File name of the caller's workflow that builds a release tag, in
          .github/workflows. It is started for the new tag, so the commit that
          is released has to hold it, as a workflow that calls
          android-release.yml. Empty starts nothing and checks nothing.
        required: false
        type: string
        default: release.yml
      environment:
        description: >-
          Optional. An environment for the job that tags. Empty, the default:
          the job runs in no environment and starts as soon as the plan
          passed. Where GitHub offers required reviewers (not for a private
          repository on the Team plan), the reviewers of an environment named
          here approve the tag. It is not the environment of the signing key:
          that one is the build job's, in android-release.yml.
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_PUSH_TOKEN:
        description: >-
          Optional. Token that pushes the tag instead of the job token, for a
          repository whose rules restrict who may create release tags.
        required: false
    outputs:
      tag:
        description: The tag of the planned version.
        value: ${{ jobs.plan.outputs.tag }}
      version:
        description: The planned version, X.Y.Z, or X.Y.0-preview.N for a preview.
        value: ${{ jobs.plan.outputs.version }}
      target-sha:
        description: The commit that is released.
        value: ${{ jobs.plan.outputs.target-sha }}
      tagged:
        description: "'true' when the tag exists on the commit after this run."
        value: ${{ jobs.tag.outputs.tagged }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Read-only. What the release would be, and whether the commit may be
  # released, is decided here, so a dry run shows every refusal a release
  # would meet. Nothing stands between this job and the tag job but the
  # confirm input, which is checked here. What can only fail while writing (a
  # version another release took meanwhile, a push the repository's rules
  # refuse) fails in the tag job.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous-tag: ${{ steps.version.outputs.previous-tag }}
      target-sha: ${{ steps.version.outputs.target-sha }}
      branch: ${{ steps.version.outputs.branch }}
      main-branch: ${{ steps.main.outputs.main-branch }}
    steps:
      # Every tag, every branch and the whole history: the last release is
      # searched among the tags the commit contains, and the commit has to be
      # on the branch of its release line.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # source-branch is always passed, so only what was merged is released.
      # Without it, the id of a commit on an open pull request would do: it
      # contains the last release, and its own pull request check may well be
      # green.
      - name: Plan the version
        id: version
        uses: asleep-ai/actions/release-version@android-ci/v1
        with:
          pr: ${{ inputs.pr }}
          sha: ${{ inputs.sha }}
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          source-branch: ${{ inputs.source-branch || github.event.repository.default_branch }}

      - name: Write the plan to the summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous-tag }}
          PREVIOUS_PRERELEASE_TAG: ${{ steps.version.outputs.previous-prerelease-tag }}
          NOTICE: ${{ steps.version.outputs.notice }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          TARGET_SHA: ${{ steps.version.outputs.target-sha }}
          LINE_BRANCH: ${{ steps.version.outputs.branch }}
          PRS: ${{ steps.version.outputs.prs }}
          PR: ${{ inputs.pr }}
          BUMP: ${{ inputs.bump }}
          VERSION_GIVEN: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "### ${PREVIOUS_TAG:-no release yet} → $TAG"
            echo
            if [[ "$DRY_RUN" == true ]]; then
              echo "**Dry run.** Nothing is tagged, pushed or started."
            else
              echo "**Not a dry run.** When every check below passes and \`confirm\` names \`$TAG\`, the commit is tagged and the release starts at once."
            fi
            echo
            echo "- Commit: [\`${TARGET_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$TARGET_SHA)${PR:+, the merge commit of #${PR#\#}}"
            echo "- Release line: \`$LINE_BRANCH\`"
            echo "- versionCode: $VERSION_CODE"
            if [[ -n "$VERSION_GIVEN" ]]; then
              echo "- The version was given (\`version\`); \`bump\` ($BUMP) is ignored."
            fi
            if [[ -n "$PRERELEASE" ]]; then
              echo "- A $PRERELEASE, not a release: it is published as a GitHub pre-release, and \`${TAG%-"$PRERELEASE".*}\` is still to be released."
              if [[ -n "$PREVIOUS_PRERELEASE_TAG" ]]; then
                echo "- The $PRERELEASE before this one is \`$PREVIOUS_PRERELEASE_TAG\`; the list below is what this one adds to it."
              fi
            fi
            if [[ -n "$NOTICE" ]]; then
              echo
              # printf: the sentence holds tag names, not a format.
              printf '> [!WARNING]\n> %s.\n' "$NOTICE"
            fi
            echo
            echo "#### Included"
            echo
            # printf: a pull request title is data, not a format or an option.
            printf '%s\n' "${PRS:-Nothing listed.}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The tag job starts release-workflow for the tag, and GitHub runs the
      # file the tagged commit holds, not the one of the branch this run was
      # started from. A commit from before the repository called
      # android-release.yml has another workflow under that name, or none: it
      # would build the tag its own way, without the checks of
      # android-release.yml and without the tag's version, or the tag would be
      # left with nothing to build it. Such a commit is refused here, before
      # anything is tagged.
      - name: Check the release workflow of the commit
        env:
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
          TARGET_SHA: ${{ steps.version.outputs.target-sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_WORKFLOW" ]]; then
            echo "No release workflow is started (release-workflow is empty): nothing to check."
            exit 0
          fi
          if [[ ! "$RELEASE_WORKFLOW" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
            echo "::error::release-workflow is not the file name of a workflow in .github/workflows (name.yml)."
            exit 1
          fi
          path=".github/workflows/$RELEASE_WORKFLOW"
          short="${TARGET_SHA:0:7}"
          later="Release a commit that has it: the merge commit of the pull request that brought the workflow in, or a later one."
          if ! content=$(git show "$TARGET_SHA:$path" 2>/dev/null); then
            echo "::error title=The commit has no release workflow::$short holds no $path, so nothing would build its tag. $later"
            exit 1
          fi
          # A uses: line of a job, whatever the owner and the ref; a line in a
          # comment does not count.
          if ! grep -Eq "^[[:space:]]*uses:[[:space:]]*[\"']?[^[:space:]#\"']+/\.github/workflows/android-release\.yml@" <<< "$content"; then
            echo "::error title=The commit's release workflow is not the shared one::$path at $short does not call android-release.yml. A commit from before the repository adopted that workflow holds the earlier one, which would build the tag without its checks and without the tag's version. $later"
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*(-[[:space:]]*)?workflow_dispatch[[:space:]]*(:|$)|^[[:space:]]*on:.*workflow_dispatch' <<< "$content"; then
            echo "::error title=The commit's release workflow cannot be started::$path at $short has no workflow_dispatch trigger, which is how the release is started for the tag. $later"
            exit 1
          fi
          echo "$path at $short calls android-release.yml and can be started for the tag."

      # A release is cut from a commit that passed the checks a pull request
      # has to pass and whose release variant was built: by default the pull
      # request check of the push and the QA build of the push, which builds
      # that variant in its place. The newest check run of each name counts. A
      # check that never ran on the commit is a refusal, like one that failed.
      # android-release.yml runs the same script on the tagged commit, and
      # android-ci's tests fail when the two copies differ.
      #
      # python3 -I: the script comes from standard input, and without -I
      # Python would look for the modules it imports in the checkout first.
      - name: Check the commit's checks
        env:
          TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.version.outputs.target-sha }}
          REQUIRED_CHECKS: ${{ inputs.required-checks }}
        run: |
          set -euo pipefail
          python3 -I - <<'CHECKS'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          api = (os.environ.get("GITHUB_API_URL") or "https://api.github.com").rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ.get("TOKEN", "").strip()
          required = [line.strip() for line in os.environ.get("REQUIRED_CHECKS", "").splitlines() if line.strip()]
          # Only android-qa.yml waits: its build starts with the push that also starts the checks. A
          # release is decided from the checks as they are.
          try:
              wait_minutes = float(os.environ.get("CHECKS_WAIT_MINUTES") or 0)
              poll_seconds = float(os.environ.get("CHECKS_POLL_SECONDS") or 30)
          except ValueError:
              sys.exit("::error::The time to wait for the checks is not a number.")
          deadline = time.monotonic() + wait_minutes * 60


          class Unreadable(Exception):
              """The checks could not be read. `again` says whether another request may succeed."""

              def __init__(self, reason, again):
                  super().__init__(reason)
                  self.again = again


          def check_runs(name):
              query = urllib.parse.urlencode({"check_name": name, "filter": "latest", "per_page": 100})
              request = urllib.request.Request(
                  f"{api}/repos/{repository}/commits/{sha}/check-runs?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "asleep-ai-actions-android-ci",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      document = json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read(300).decode(errors="replace").strip()
                  # A server error and a rate limit pass; a token that may not read the checks does not.
                  raise Unreadable(f"HTTP {error.code}: {detail}", error.code >= 500 or error.code == 429) from None
              except (OSError, ValueError) as error:
                  raise Unreadable(str(error) or type(error).__name__, True) from None
              runs = document.get("check_runs") if isinstance(document, dict) else None
              if not isinstance(runs, list):
                  raise Unreadable("the response has no check_runs list", True)
              return [run for run in runs if isinstance(run, dict) and run.get("name") == name]


          while True:
              rows = []
              refused = []
              # Checks that may still succeed: not started on the commit yet, or not finished.
              unfinished = []
              try:
                  for name in required:
                      runs = check_runs(name)
                      if not runs:
                          rows.append((name, "not run", ""))
                          refused.append(f"'{name}' did not run on the commit")
                          unfinished.append(name)
                          continue
                      newest = max(runs, key=lambda run: (str(run.get("started_at") or ""), run.get("id") or 0))
                      state = newest.get("conclusion") or newest.get("status") or "unknown"
                      rows.append((name, state, newest.get("html_url") or ""))
                      if newest.get("status") != "completed":
                          refused.append(f"'{name}' is {state}")
                          unfinished.append(name)
                      elif newest.get("conclusion") != "success":
                          refused.append(f"'{name}' is {state}")
              except Unreadable as error:
                  # Not an answer of the checks. Where the step waits, it asks many times, and one request
                  # that failed is asked again until the wait is over. Without a wait it fails at once.
                  remaining = deadline - time.monotonic()
                  if not error.again or remaining <= 0:
                      sys.exit(f"::error::Cannot read the checks of {sha}: {error}")
                  print(f"Cannot read the checks of {sha} ({error}). Asking again.", flush=True)
                  time.sleep(min(poll_seconds, remaining))
                  continue
              # A check that finished without success is final: waiting for the others changes nothing.
              remaining = deadline - time.monotonic()
              if not unfinished or len(refused) > len(unfinished) or remaining <= 0:
                  break
              print(f"Waiting for {', '.join(unfinished)} ({'; '.join(refused)}).", flush=True)
              time.sleep(min(poll_seconds, remaining))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("#### Checks on the commit\n\n")
              if not rows:
                  summary.write("No check is required (`required-checks` is empty).\n\n")
              else:
                  summary.write("| check | result |\n|-------|--------|\n")
                  for name, state, url in rows:
                      summary.write(f"| {name} | {f'[{state}]({url})' if url else state} |\n")
                  summary.write("\n")

          if not required:
              print("::notice::No check is required: required-checks is empty.")
          for name, state, _ in rows:
              print(f"{name}: {state}")
          if refused:
              # The checks answered, and the answer is no. A step that could not read them never gets
              # here, so the output tells the two apart for the steps that follow.
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("refused=true\n")
              # Only when the wait ran out: a check that failed ended it early.
              waited = f" after waiting {wait_minutes:g} minutes" if wait_minutes and len(refused) == len(unfinished) else ""
              print(f"::error title=The commit has not passed its checks::{sha[:7]}: {'; '.join(refused)}{waited}. "
                    "Take a commit whose checks succeeded, or run them again on this one.")
              sys.exit(1)
          CHECKS

      # Only for a caller that names a main-branch; by default no branch is
      # moved. The branch only ever moves forward to a released commit. When
      # it holds a commit the release lacks, moving it would drop that commit,
      # so the release is refused until the working branch has received it.
      #
      # The branch follows the releases of the source branch only. A release
      # from a maintenance branch (release/<major>.x) is a commit the main
      # branch cannot move forward to, and it is left where it is. The source
      # branch itself is never moved: it holds the commit already. A preview
      # moves no branch either: the branch follows the releases.
      - name: Check that the main branch can move
        id: main
        env:
          MAIN_BRANCH: ${{ inputs.main-branch }}
          LINE_BRANCH: ${{ steps.version.outputs.branch }}
          SOURCE_BRANCH: ${{ inputs.source-branch || github.event.repository.default_branch }}
          TARGET_SHA: ${{ steps.version.outputs.target-sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          moved="$MAIN_BRANCH"
          if [[ -z "$MAIN_BRANCH" ]]; then
            line="No branch is moved: the tag is the release."
          elif [[ -n "$PRERELEASE" ]]; then
            moved=""
            line="\`$MAIN_BRANCH\` is not moved: it follows the releases, and this is a $PRERELEASE."
          elif [[ "$MAIN_BRANCH" == "$SOURCE_BRANCH" ]]; then
            moved=""
            line="No branch is moved: \`$MAIN_BRANCH\` is the branch the release is cut from."
          elif [[ "$LINE_BRANCH" != "$SOURCE_BRANCH" ]]; then
            moved=""
            line="\`$MAIN_BRANCH\` is not moved: it follows the releases of \`$SOURCE_BRANCH\`, and this one is cut from \`$LINE_BRANCH\`."
          elif [[ "$MAIN_BRANCH" == -* ]] || ! git check-ref-format "refs/heads/$MAIN_BRANCH"; then
            echo "::error::main-branch is not a branch name: $MAIN_BRANCH"
            exit 1
          elif ! current=$(git rev-parse --verify --quiet "refs/remotes/origin/$MAIN_BRANCH^{commit}"); then
            line="\`$MAIN_BRANCH\` does not exist and is created at the commit."
          elif [[ "$current" == "$TARGET_SHA" ]]; then
            line="\`$MAIN_BRANCH\` is at the commit already."
          elif git merge-base --is-ancestor "$current" "$TARGET_SHA"; then
            line="\`$MAIN_BRANCH\` moves forward by $(git rev-list --count "$current..$TARGET_SHA") commit(s), from \`${current:0:7}\`."
          else
            echo "::error title=$MAIN_BRANCH cannot move forward::$MAIN_BRANCH (${current:0:7}) holds $(git rev-list --count "$TARGET_SHA..$current") commit(s) that ${TARGET_SHA:0:7} lacks. Merge $MAIN_BRANCH into the branch that is released, then release a commit after that merge."
            git log --oneline -10 "$TARGET_SHA..$current"
            exit 1
          fi
          echo "${line//\`/}"
          echo "main-branch=$moved" >> "$GITHUB_OUTPUT"
          {
            echo "#### Branch"
            echo
            echo "$line"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The last step of the plan, and the only word a person has in a
      # release: no job waits for anyone. A run that is not a dry run goes on
      # to tag only when confirm repeats the version this plan computed, which
      # the person knows from the summary of a dry run. A wrong bump or
      # version then ends here instead of in a published release; a wrong pr
      # merged after the last release plans the same version and is not caught. A dry run
      # does not read confirm; having passed every check, it says what to pass.
      - name: Check the confirmation
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous-tag }}
        run: |
          set -euo pipefail
          plan="${PREVIOUS_TAG:-no release yet} → $TAG"
          if [[ "$DRY_RUN" == true ]]; then
            echo "Dry run: confirm is not read. To release this plan ($plan), start the run again with dry_run=false and confirm=$TAG."
            {
              echo "#### To release this plan"
              echo
              echo "Every check passed. Start the run again with the same inputs, \`dry_run\` off and \`confirm\` set to \`$TAG\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          refuse() {
            echo "::error title=$1::$2 Nothing is tagged. Read the plan in the summary of this run, and when it is the release you mean, start the run again with confirm=$TAG."
            {
              echo "#### Not released: $1"
              echo
              echo "$2 Nothing is tagged."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          # Whitespace around the value is not part of it.
          confirm="${CONFIRM#"${CONFIRM%%[![:space:]]*}"}"
          confirm="${confirm%"${confirm##*[![:space:]]}"}"
          if [[ -z "$confirm" ]]; then
            refuse "The release is not confirmed" "The plan computed $TAG ($plan), and confirm is empty: a run that is not a dry run has to name the planned version."
          fi
          # Only a version is printed back: X.Y.Z, or the name of a prerelease
          # of one, X.Y.0-preview.N.
          if [[ ! "$confirm" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            refuse "confirm is not a version" "The plan computed $TAG ($plan), and confirm is not of the form X.Y.Z or vX.Y.Z (X.Y.0-preview.N for a preview)."
          fi
          if [[ "$confirm" != "$TAG" && "$confirm" != "$VERSION" ]]; then
            refuse "confirm does not name the planned version" "The plan computed $TAG ($plan), and confirm is $confirm."
          fi
          echo "Confirmed: $TAG."
          {
            echo "#### Confirmed"
            echo
            echo "\`confirm\` names the planned version, \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job that writes. It follows the plan at once: with the default,
  # empty environment nobody is asked, and a run that is not a dry run and
  # whose plan passed pushes the tag.
  tag:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      actions: write
      pull-requests: read
    outputs:
      tagged: ${{ steps.push.outputs.tagged }}
    steps:
      # The token stays in the clone: the push below uses it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
          persist-credentials: true

      # A run that tagged and then failed can be run again: the tag is found
      # on the commit, and only what is left is done.
      - name: Look for the tag
        id: state
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET_SHA: ${{ needs.plan.outputs.target-sha }}
        run: |
          set -euo pipefail
          existing=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [[ -z "$existing" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist yet."
          elif [[ "$existing" == "$TARGET_SHA" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG is on $TARGET_SHA already: an earlier attempt created it."
          else
            echo "::error::Tag $TAG exists on $existing, not on $TARGET_SHA. Another release took this version; start the version bump again."
            exit 1
          fi

      # The plan may be old by now: the job waited for a runner or for the
      # reviewers of an environment, or it is a re-run of a failed attempt,
      # which keeps the plan of the first. The version is planned again from
      # the repository as it is now, and has to come out the same.
      - name: Plan the version again
        id: version
        if: ${{ steps.state.outputs.exists == 'false' }}
        uses: asleep-ai/actions/release-version@android-ci/v1
        with:
          sha: ${{ needs.plan.outputs.target-sha }}
          bump: ${{ inputs.bump }}
          version: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          source-branch: ${{ inputs.source-branch || github.event.repository.default_branch }}

      # One atomic push. With a main-branch, the tag and the branch move
      # together or not at all, so a branch the token may not push to leaves
      # no tag behind. The branch push is not forced, so the server accepts
      # only a fast-forward.
      - name: Push the tag and the main branch
        id: push
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous-tag }}
          TARGET_SHA: ${{ needs.plan.outputs.target-sha }}
          TAG_EXISTS: ${{ steps.state.outputs.exists }}
          TAG_NOW: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG_NOW: ${{ steps.version.outputs.previous-tag }}
          # Empty when no branch is moved: main-branch is empty or the source
          # branch, or the release is cut from a maintenance branch.
          MAIN_BRANCH: ${{ needs.plan.outputs.main-branch }}
        run: |
          set -euo pipefail
          refs=()
          if [[ "$TAG_EXISTS" != true ]]; then
            if [[ "$TAG_NOW" != "$TAG" || "$PREVIOUS_TAG_NOW" != "$PREVIOUS_TAG" ]]; then
              echo "::error::The plan was $TAG after ${PREVIOUS_TAG:-no release}; the repository now gives $TAG_NOW after ${PREVIOUS_TAG_NOW:-no release}. Another release happened meanwhile; start the version bump again."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$TARGET_SHA"
            refs+=("refs/tags/$TAG")
          fi
          if [[ -n "$MAIN_BRANCH" ]]; then
            refs+=("$TARGET_SHA:refs/heads/$MAIN_BRANCH")
          fi
          if [[ "${#refs[@]}" != 0 ]]; then
            git push --atomic origin "${refs[@]}"
          fi
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${refs[*]:-nothing}"

      # A tag pushed with the job token starts no workflow, so the caller's
      # release workflow is started for the tag explicitly. Starting a
      # workflow by hand is one of the two events the job token may cause.
      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
        run: |
          set -euo pipefail
          {
            echo "### Tagged $TAG"
            echo
            if [[ -z "$RELEASE_WORKFLOW" ]]; then
              echo "No release workflow is started (\`release-workflow\` is empty)."
            else
              gh workflow run "$RELEASE_WORKFLOW" --ref "$TAG" >&2
              echo "Started [\`$RELEASE_WORKFLOW\`]($GITHUB_SERVER_URL/$GH_REPO/actions/workflows/$RELEASE_WORKFLOW) for \`$TAG\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged $TAG. Release workflow: ${RELEASE_WORKFLOW:-none}."
