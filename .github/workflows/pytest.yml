name: pytest

on:
  pull_request:
    paths:
      - '.github/workflows/pytest.yml'
      - 'gradle-log-verdict/**'
      - 'release-notes/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pytest.yml'
      - 'gradle-log-verdict/**'
      - 'release-notes/**'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--with openai` because generate.py imports it at module load; the unit
      # tests stub the network and never call OpenAI, so the version is unpinned.
      - name: Run tests
        run: uv run --with pytest --with openai python -m pytest release-notes -q

      - name: Run gradle-log-verdict tests
        run: uv run --with pytest python -m pytest gradle-log-verdict -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. The log file does not exist, so a
      # failed build is infra.
      - name: Run the gradle-log-verdict action
        id: verdict
        uses: ./gradle-log-verdict
        with:
          log-file: ${{ runner.temp }}/no-gradle.log
          setup-outcome: success success
          build-outcome: failure

      - name: Check the gradle-log-verdict output
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          set -euo pipefail
          echo "verdict=$VERDICT"
          [[ "$VERDICT" == infra ]]
