name: pytest

on:
  pull_request:
    paths:
      - '.github/workflows/pytest.yml'
      - 'android-signing/**'
      - 'gradle-log-verdict/**'
      - 'release-notes/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pytest.yml'
      - 'android-signing/**'
      - 'gradle-log-verdict/**'
      - 'release-notes/**'
  # The android-signing job verifies real APKs with every build-tools version
  # on the runner image. The image gains versions without a change here, and a
  # new apksigner can print certificates differently, so that job also runs
  # weekly instead of waiting for the next pull request that touches it.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--with openai` because generate.py imports it at module load; the unit
      # tests stub the network and never call OpenAI, so the version is unpinned.
      - name: Run tests
        run: uv run --with pytest --with openai python -m pytest release-notes -q

  # One job per component: a failure in one does not hide the others.
  android-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json android-signing/action.yml

      # The runner image has an Android SDK and a JDK, so the test that signs
      # and verifies real APKs must run here, not skip.
      - name: Run tests
        env:
          ANDROID_SIGNING_INTEGRATION: '1'
        run: uv run --with pytest python -m pytest android-signing -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. The value is not a keystore; decode
      # only writes the bytes it is given.
      - name: Run android-signing decode
        id: decode
        uses: ./android-signing
        with:
          operation: decode
          keystore-base64: bm90IGEga2V5c3RvcmU=

      - name: Check the decoded file
        env:
          KEYSTORE_FILE: ${{ steps.decode.outputs.keystore-file }}
        run: |
          set -euo pipefail
          echo "keystore-file=$KEYSTORE_FILE"
          [[ "$KEYSTORE_FILE" == "$RUNNER_TEMP/release.jks" ]]
          [[ "$(cat "$KEYSTORE_FILE")" == "not a keystore" ]]
          echo "KEY_PASSWORD=not-a-secret" > "$RUNNER_TEMP/local.properties"

      - name: Run android-signing cleanup
        if: ${{ always() }}
        uses: ./android-signing
        with:
          operation: cleanup
          keystore-file: ${{ steps.decode.outputs.keystore-file }}
          paths: |
            ${{ runner.temp }}/local.properties
            ${{ runner.temp }}/no-such-file

      - name: Check the files are gone
        run: |
          set -euo pipefail
          [[ ! -e "$RUNNER_TEMP/release.jks" ]]
          [[ ! -e "$RUNNER_TEMP/local.properties" ]]

  gradle-log-verdict:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json gradle-log-verdict/action.yml

      - name: Run tests
        run: uv run --with pytest python -m pytest gradle-log-verdict -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. The log file does not exist, so a
      # failed build is infra.
      - name: Run the action on a failed build
        id: failed
        uses: ./gradle-log-verdict
        with:
          log-file: ${{ runner.temp }}/no-gradle.log
          setup-outcome: success success
          build-outcome: failure

      # A skipped build in a job that has succeeded so far is pass.
      - name: Run the action on a skipped build with the job status
        id: skipped
        uses: ./gradle-log-verdict
        with:
          log-file: ${{ runner.temp }}/no-gradle.log
          setup-outcome: success
          build-outcome: skipped
          job-status: ${{ job.status }}

      - name: Check the verdicts
        env:
          FAILED: ${{ steps.failed.outputs.verdict }}
          SKIPPED: ${{ steps.skipped.outputs.verdict }}
        run: |
          set -euo pipefail
          echo "failed=$FAILED skipped=$SKIPPED"
          [[ "$FAILED" == infra ]]
          [[ "$SKIPPED" == pass ]]
