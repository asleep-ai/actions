name: pytest

on:
  pull_request:
    paths:
      - '.github/workflows/pytest.yml'
      - '.github/workflows/android-*.yml'
      - 'android-ci/**'
      - 'android-signing/**'
      - 'gradle-log-verdict/**'
      - 'pick-runner/**'
      # The android-ci tests compare a default with pre-commit-changed/action.yml.
      - 'pre-commit-changed/action.yml'
      - 'release-notes/**'
      - 'release-version/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pytest.yml'
      - '.github/workflows/android-*.yml'
      - 'android-ci/**'
      - 'android-signing/**'
      - 'gradle-log-verdict/**'
      - 'pick-runner/**'
      - 'pre-commit-changed/action.yml'
      - 'release-notes/**'
      - 'release-version/**'
  # The android-signing job verifies real APKs with every build-tools version
  # on the runner image. The image gains versions without a change here, and a
  # new apksigner can print certificates differently, so that job also runs
  # weekly instead of waiting for the next pull request that touches it.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  pytest:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `--with openai` because generate.py imports it at module load; the unit
      # tests stub the network and never call OpenAI, so the version is unpinned.
      - name: Run tests
        run: uv run --with pytest --with openai python -m pytest release-notes -q

  # One job per component: a failure in one does not hide the others.
  android-ci:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The tests run the shell of the reusable workflows' steps. The runner
      # image has a JDK, so the test that generates a key with the real keytool
      # must run here, not skip.
      - name: Run tests
        env:
          ANDROID_CI_KEYTOOL: '1'
        run: uv run --with pytest --with pyyaml python -m pytest android-ci -q

  android-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json android-signing/action.yml

      # The runner image has an Android SDK and a JDK, so the test that signs
      # and verifies real APKs must run here, not skip.
      - name: Run tests
        env:
          ANDROID_SIGNING_INTEGRATION: '1'
        run: uv run --with pytest python -m pytest android-signing -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. The value is not a keystore; decode
      # only writes the bytes it is given.
      - name: Run android-signing decode
        id: decode
        uses: ./android-signing
        with:
          operation: decode
          keystore-base64: bm90IGEga2V5c3RvcmU=

      - name: Check the decoded file
        env:
          KEYSTORE_FILE: ${{ steps.decode.outputs.keystore-file }}
        run: |
          set -euo pipefail
          echo "keystore-file=$KEYSTORE_FILE"
          [[ "$KEYSTORE_FILE" == "$RUNNER_TEMP/release.jks" ]]
          [[ "$(cat "$KEYSTORE_FILE")" == "not a keystore" ]]
          echo "KEY_PASSWORD=not-a-secret" > "$RUNNER_TEMP/local.properties"

      - name: Run android-signing cleanup
        if: ${{ always() }}
        uses: ./android-signing
        with:
          operation: cleanup
          keystore-file: ${{ steps.decode.outputs.keystore-file }}
          paths: |
            ${{ runner.temp }}/local.properties
            ${{ runner.temp }}/no-such-file

      - name: Check the files are gone
        run: |
          set -euo pipefail
          [[ ! -e "$RUNNER_TEMP/release.jks" ]]
          [[ ! -e "$RUNNER_TEMP/local.properties" ]]

  gradle-log-verdict:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json gradle-log-verdict/action.yml

      - name: Run tests
        run: uv run --with pytest python -m pytest gradle-log-verdict -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. The log file does not exist, so a
      # failed build is infra.
      - name: Run the action on a failed build
        id: failed
        uses: ./gradle-log-verdict
        with:
          log-file: ${{ runner.temp }}/no-gradle.log
          setup-outcome: success success
          build-outcome: failure

      # A skipped build in a job that has succeeded so far is pass.
      - name: Run the action on a skipped build with the job status
        id: skipped
        uses: ./gradle-log-verdict
        with:
          log-file: ${{ runner.temp }}/no-gradle.log
          setup-outcome: success
          build-outcome: skipped
          job-status: ${{ job.status }}

      - name: Check the verdicts
        env:
          FAILED: ${{ steps.failed.outputs.verdict }}
          SKIPPED: ${{ steps.skipped.outputs.verdict }}
        run: |
          set -euo pipefail
          echo "failed=$FAILED skipped=$SKIPPED"
          [[ "$FAILED" == infra ]]
          [[ "$SKIPPED" == pass ]]

  release-version:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the action is run on this repository below, and it
      # refuses a shallow checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json release-version/action.yml

      - name: Run tests
        run: uv run --with pytest python -m pytest release-version -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. The prefix matches no tag of
      # this repository, so the commit is planned as a first release.
      - name: Run the action on this commit
        id: next
        uses: ./release-version
        with:
          sha: ${{ github.sha }}
          bump: minor
          tag-prefix: release-version-ci/v

      - name: Run the action for a versionCode
        id: code
        uses: ./release-version
        with:
          operation: code
          version: v1.13.1

      - name: Check the outputs
        env:
          TAG: ${{ steps.next.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.next.outputs.previous-tag }}
          TARGET_SHA: ${{ steps.next.outputs.target-sha }}
          PRS: ${{ steps.next.outputs.prs }}
          NEXT_CODE: ${{ steps.next.outputs.version-code }}
          VERSION: ${{ steps.code.outputs.version }}
          VERSION_CODE: ${{ steps.code.outputs.version-code }}
        run: |
          set -euo pipefail
          echo "tag=$TAG previous-tag=$PREVIOUS_TAG target-sha=$TARGET_SHA version-code=$NEXT_CODE"
          [[ "$TAG" == release-version-ci/v0.1.0 ]]
          [[ -z "$PREVIOUS_TAG" ]]
          [[ "$TARGET_SHA" == "$GITHUB_SHA" ]]
          [[ "$NEXT_CODE" == 150000 ]]
          # A value of several lines arrives whole.
          [[ "$(wc -l <<< "$PRS")" -gt 1 ]]
          [[ "$VERSION" == 1.13.1 && "$VERSION_CODE" == 101350001 ]]

  pick-runner:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json pick-runner/action.yml

      - name: Run tests
        run: uv run --with pytest python -m pytest pick-runner -q

      # Load the action the way a caller does: an action.yml GitHub cannot load
      # passes actionlint and the unit tests. With no token the check is skipped
      # (hence the "Runner check skipped" warning on this job), so no secret is
      # needed.
      - name: Run the pick-runner action
        id: pick
        uses: ./pick-runner
        with:
          labels: '["self-hosted","Linux","X64"]'
          token: ''

      - name: Check the pick-runner outputs
        env:
          RUNS_ON: ${{ steps.pick.outputs.runs-on }}
          SELF_HOSTED: ${{ steps.pick.outputs.self-hosted }}
          ONLINE_COUNT: ${{ steps.pick.outputs.online-count }}
        run: |
          set -euo pipefail
          echo "runs-on=$RUNS_ON self-hosted=$SELF_HOSTED online-count=$ONLINE_COUNT"
          [[ "$RUNS_ON" == '["self-hosted","Linux","X64"]' ]]
          [[ "$SELF_HOSTED" == true ]]
          [[ -z "$ONLINE_COUNT" ]]
