name: lint-tools

on:
  pull_request:
    paths:
      - '.github/workflows/lint-tools.yml'
      - '.pre-commit-hooks.yaml'
      - 'ktfmt/**'
      - 'pre-commit-changed/**'
      - 'ruff/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-tools.yml'
      - '.pre-commit-hooks.yaml'
      - 'ktfmt/**'
      - 'pre-commit-changed/**'
      - 'ruff/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.2'

      - name: Validate shared hook manifest
        run: uv run --with pre-commit pre-commit validate-manifest .pre-commit-hooks.yaml

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json pre-commit-changed/action.yml

      - name: Test lint execution and real ktfmt integration
        env:
          KTFMT_INTEGRATION: '1'
        run: uv run --with pytest --with pre-commit python -m pytest ktfmt pre-commit-changed -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        id: get
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint Ruff workflow example
        run: ${{ steps.get.outputs.executable }} ruff/ruff.yml.example
