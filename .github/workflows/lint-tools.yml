name: lint-tools

on:
  pull_request:
    paths:
      - '.github/workflows/lint-tools.yml'
      - '.pre-commit-hooks.yaml'
      - 'detekt/**'
      - 'ktfmt/**'
      - 'pre-commit-changed/**'
      - 'ruff/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-tools.yml'
      - '.pre-commit-hooks.yaml'
      - 'detekt/**'
      - 'ktfmt/**'
      - 'pre-commit-changed/**'
      - 'ruff/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.2'

      - name: Validate shared hook manifest
        run: uv run --with pre-commit pre-commit validate-manifest .pre-commit-hooks.yaml

      - name: Validate composite action metadata
        run: uvx check-jsonschema --schemafile https://json.schemastore.org/github-action.json pre-commit-changed/action.yml

      # The detekt tests run the hook against a real detekt-cli on PATH. The
      # checksum pins the release asset; java is on the runner image.
      - name: Install detekt-cli
        env:
          DETEKT_VERSION: '1.23.8'
          DETEKT_SHA256: ff9f9258879ff2ec4349114740221498afec46a85cf6302c9f80b06eb4429501
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/detekt-cli.zip" \
            "https://github.com/detekt/detekt/releases/download/v$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION.zip"
          echo "$DETEKT_SHA256  $RUNNER_TEMP/detekt-cli.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/detekt-cli.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/detekt-cli-$DETEKT_VERSION/bin" >> "$GITHUB_PATH"

      - name: Test lint execution and real ktfmt and detekt integration
        env:
          KTFMT_INTEGRATION: '1'
          DETEKT_INTEGRATION: '1'
        run: uv run --with pytest --with pre-commit python -m pytest ktfmt detekt pre-commit-changed -q

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        id: get
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint Ruff workflow example
        run: ${{ steps.get.outputs.executable }} ruff/ruff.yml.example
