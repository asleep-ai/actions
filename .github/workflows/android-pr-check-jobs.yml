name: Android PR check jobs

# The jobs of android-pr-check.yml, which calls this file once on the runners
# pick-runner picked and, after an infrastructure failure on self-hosted
# runners, once more on a GitHub-hosted runner. Each job reports a verdict
# (pass, code or infra) that decides whether the second call happens.
#
# This file is internal to android-pr-check.yml: call that workflow, not this
# one. The inputs are documented there and in android-ci/README.md.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on as JSON: a label array, or a quoted runner label such as "ubuntu-latest"'
        required: true
        type: string
      attempt:
        description: 'primary or fallback. Both calls share one workflow run, so artifact names carry it.'
        required: true
        type: string
      java-version:
        required: true
        type: string
      java-distribution:
        required: true
        type: string
      mise-version:
        required: true
        type: string
      full-scan-paths:
        required: false
        type: string
        default: ''
      verify-args:
        required: false
        type: string
        default: ''
      verify-signing-key:
        required: true
        type: boolean
      release-build-args:
        required: false
        type: string
        default: ''
      release-build-skip-push-branches:
        required: false
        type: string
        default: ''
      checkout-submodules:
        required: true
        type: string
      local-properties:
        required: false
        type: string
        default: ''
      paths-ignore:
        required: false
        type: string
        default: ''
      code-style-timeout-minutes:
        required: true
        type: number
      verify-timeout-minutes:
        required: true
        type: number
      release-build-timeout-minutes:
        required: true
        type: number
      self-hosted-max-workers:
        required: false
        type: string
        default: ''
      self-hosted-gradle-jvmargs:
        required: false
        type: string
        default: ''
      self-hosted-kotlin-daemon-jvmargs:
        required: false
        type: string
        default: ''
    secrets:
      GIT_TOKEN:
        description: 'Optional. Token for private submodules and private GitHub Packages.'
        required: false
    outputs:
      code-style-verdict:
        description: 'pass, code or infra; empty when the job never reported (its runner went away)'
        value: ${{ jobs.code-style.outputs.verdict }}
      verify-verdict:
        description: 'pass, code or infra; empty when the job never reported (its runner went away)'
        value: ${{ jobs.verify.outputs.verdict }}
      release-build-verdict:
        description: 'pass, code or infra; empty when the job never reported (its runner went away)'
        value: ${{ jobs.release-build.outputs.verdict }}

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  code-style:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.code-style-timeout-minutes }}
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # A self-hosted runner keeps its work folder between jobs. A job that is
      # cancelled while git is writing leaves a lock file behind, in the
      # repository or in a submodule, and every later checkout in that folder
      # fails on it ("index.lock: File exists"). A runner runs one job at a
      # time, so a lock found before checkout has no owner. actions/checkout
      # clears only the repository's own index.lock and shallow.lock.
      - name: Remove stale git lock files
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            while IFS= read -r -d '' lock; do
              echo "Removing ${lock#"$GITHUB_WORKSPACE/"}, left by an earlier job on this runner."
              rm -f -- "$lock"
            done < <(find "$GITHUB_WORKSPACE/.git" -type f -name '*.lock' -print0)
          fi

      # The pull request head, not the merge commit, with full history:
      # pre-commit-changed compares the head with its merge base.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # pre-commit and every tool the caller's hooks need come from the
      # caller's mise configuration.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        id: mise
        with:
          version: ${{ inputs.mise-version }}
          # A self-hosted runner keeps the installed tools; restoring the
          # Actions cache there only costs time.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Run pre-commit on the changed files
        id: pre-commit
        uses: asleep-ai/actions/pre-commit-changed@android-ci/stage-2
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          # Always passed, so an empty value means no full runs, not the
          # action's default; android-pr-check.yml carries that default.
          full-scan-paths: ${{ inputs.full-scan-paths }}

      # Setup that failed (checkout, tool install) is infra; a failed hook is
      # the change's own. A hook run cut off by the job timeout (cancelled) is
      # infra too.
      - name: Report the verdict
        id: verdict
        if: ${{ always() }}
        env:
          SETUP: ${{ steps.checkout.outcome }} ${{ steps.mise.outcome }}
          CHECK: ${{ steps.pre-commit.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SETUP" != "success success" ]]; then
            verdict=infra
          elif [[ "$CHECK" == success ]]; then
            verdict=pass
          elif [[ "$CHECK" == failure ]]; then
            verdict=code
          else
            verdict=infra
          fi
          echo "verdict=$verdict (setup: $SETUP, pre-commit: $CHECK)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # verify and release-build share every step up to the report upload; only
  # the Gradle task, its arguments, the skip rule and the signing key of
  # verify differ. android-ci's tests fail when the two copies drift apart.
  verify:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.verify-timeout-minutes }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Remove stale git lock files
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            while IFS= read -r -d '' lock; do
              echo "Removing ${lock#"$GITHUB_WORKSPACE/"}, left by an earlier job on this runner."
              rm -f -- "$lock"
            done < <(find "$GITHUB_WORKSPACE/.git" -type f -name '*.lock' -print0)
          fi

      # GIT_TOKEN is used only when submodules are checked out: it reaches
      # private ones, and the job token reads the repository itself. Two
      # commits deep, so the plan step can compare a pull request's merge
      # commit with its first parent. The token stays in the clone only on a
      # push, where the plan step may have to fetch the previous commit; a
      # pull request's code never finds a token in the clone.
      - uses: actions/checkout@v7
        id: checkout
        with:
          token: ${{ inputs.checkout-submodules != 'false' && secrets.GIT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout-submodules }}
          fetch-depth: 2
          persist-credentials: ${{ github.event_name == 'push' }}

      # Lists the files the pull request or push changed with git alone, and
      # skips the build when all of them match paths-ignore. A skipped build
      # still ends in a successful job, so a required check built on this
      # workflow reports on a documentation-only change too. Whenever the
      # change cannot be listed, the answer is to build.
      - name: Decide whether to build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
          SKIP_PUSH_BRANCHES: ''
        run: |
          set -euo pipefail
          python3 - <<'PLAN'
          import os
          import re
          import subprocess

          event = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          before = os.environ.get("BEFORE", "").strip()
          ignored = [line.strip() for line in os.environ.get("PATHS_IGNORE", "").splitlines() if line.strip()]
          skipped_branches = os.environ.get("SKIP_PUSH_BRANCHES", "").replace(",", " ").split()


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, check=False)


          def glob(pattern):
              # The syntax of full-scan-paths: `**/` spans zero or more directories, any
              # other `**` matches anything, `*` and `?` stay within one path segment.
              pattern = re.sub(r"^(\./|/)+", "", pattern)
              regex, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      regex, i = regex + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      regex, i = regex + ".*", i + 2
                  else:
                      regex, i = regex + {"*": "[^/]*", "?": "[^/]"}.get(pattern[i], re.escape(pattern[i])), i + 1
              return re.compile(regex)


          def base_commit():
              """The commit to compare HEAD with, or None and why there is none."""
              if event == "pull_request":
                  # The checkout is the merge commit; its first parent is the base branch.
                  return "HEAD^1", ""
              if event != "push":
                  return None, f"a {event} run always builds"
              if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", before) or set(before) == {"0"}:
                  return None, "the push has no previous commit, as on a new branch"
              if git("cat-file", "-e", before + "^{commit}").returncode != 0:
                  if git("fetch", "--no-tags", "--depth=1", "origin", before).returncode != 0:
                      return None, "the push's previous commit cannot be fetched, as after a force push"
              return before, ""


          def decide():
              base, reason = base_commit()
              if base is None:
                  return True, reason
              diff = git("diff", "--name-only", "--no-renames", "-z", base, "HEAD", "--")
              if diff.returncode != 0:
                  return True, "git cannot list the changed files: " + diff.stderr.decode(errors="replace").strip()
              files = [os.fsdecode(path) for path in diff.stdout.split(b"\0") if path]
              patterns = [glob(pattern) for pattern in ignored]
              code = [path for path in files if not any(pattern.fullmatch(path) for pattern in patterns)]
              if not code:
                  return False, f"all {len(files)} changed file(s) match paths-ignore"
              return True, f"{len(code)} of {len(files)} changed file(s) are outside paths-ignore, the first being {code[0]}"


          build, reason = decide()
          if build and event == "push":
              for branch in skipped_branches:
                  if ref == "refs/heads/" + branch:
                      build, reason = False, f"this build is skipped on a push to {branch}"
          print(f"build={str(build).lower()}: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"build={str(build).lower()}\n")
          PLAN

      - name: Set up the JDK
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # On a GitHub-hosted runner the run restores the Gradle user home
          # from the Actions cache and saves it again. A self-hosted runner
          # keeps its Gradle user home between jobs, so the Actions cache there
          # only adds restore and save time.
          cache-read-only: false
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      # The signing key exists only in this job's temp directory. It lets the
      # build sign without any secret, so pull requests from forks and
      # Dependabot build the same way. local-properties holds placeholder
      # values for a pull request build, never secrets.
      - name: Write local.properties
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          LOCAL_PROPERTIES: ${{ inputs.local-properties }}
          SIGNING_KEY: ${{ inputs.verify-signing-key }}
        run: |
          set -euo pipefail
          comment='^[[:space:]]*#'
          assignment='^[A-Za-z_][A-Za-z0-9_.]*='
          signing='^(KEYSTORE_FILE|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)='
          lines=()
          number=0
          invalid=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            number=$((number + 1))
            line="${line%$'\r'}"
            if [[ -z "${line//[[:space:]]/}" || "$line" =~ $comment ]]; then
              continue
            fi
            # The line itself is not printed: a value pasted here by mistake stays out of the log.
            if [[ ! "$line" =~ $assignment ]]; then
              echo "::error title=Invalid local-properties::Line $number is not NAME=value."
              invalid=1
            elif [[ "$line" =~ $signing ]]; then
              echo "::error title=Invalid local-properties::Line $number sets ${line%%=*}, which this workflow writes itself."
              invalid=1
            else
              lines+=("$line")
            fi
          done <<< "$LOCAL_PROPERTIES"
          if [[ "$invalid" != 0 ]]; then
            exit 1
          fi
          if [[ "$SIGNING_KEY" != true && "${#lines[@]}" == 0 ]]; then
            echo "Nothing to write: no signing key in this job and no local-properties lines."
            exit 0
          fi

          {
            if [[ "$SIGNING_KEY" == true ]]; then
              keystore="$RUNNER_TEMP/android-pr-check.jks"
              password=android-pr-check
              rm -f "$keystore"
              keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
                -storepass "$password" -keypass "$password" -alias android-pr-check \
                -keyalg RSA -keysize 2048 -validity 30 \
                -dname "CN=Android PR check throwaway key" >&2
              echo "KEYSTORE_FILE=$keystore"
              echo "KEYSTORE_PASSWORD=$password"
              echo "KEY_ALIAS=android-pr-check"
              echo "KEY_PASSWORD=$password"
            fi
            for line in ${lines[@]+"${lines[@]}"}; do
              printf '%s\n' "$line"
            done
          } > local.properties
          echo "Wrote local.properties: signing key $SIGNING_KEY, ${#lines[@]} caller line(s)."

      - name: Run Gradle
        id: build
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          GRADLE_TASK: ciVerify
          # --continue reports build, test and lint failures of one run together.
          GRADLE_ARGS: --continue ${{ inputs.verify-args }}
          # Scoped to this step: Gradle reads GITHUB_ACTOR and GITHUB_TOKEN as
          # GitHub Packages credentials. The job token cannot read packages of
          # other repositories, so GIT_TOKEN wins when the caller has it.
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GIT_TOKEN != '' && 'GIT_TOKEN' || 'the job token (GIT_TOKEN did not reach this job)' }}
          RUNNER_KIND: ${{ runner.environment }}
          MAX_WORKERS: ${{ inputs.self-hosted-max-workers }}
          GRADLE_JVMARGS: ${{ inputs.self-hosted-gradle-jvmargs }}
          KOTLIN_DAEMON_JVMARGS: ${{ inputs.self-hosted-kotlin-daemon-jvmargs }}
        run: |
          set -euo pipefail
          # A self-hosted host usually has far more cores than a build has
          # memory for: Gradle starts one worker per core by default, and the
          # heap in the caller's gradle.properties is sized for a small
          # machine. --no-daemon: runners on one host share the Gradle user
          # home, so a build could attach to another job's idle daemon, which
          # that job's runner kills when the job ends.
          extra=()
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            extra+=(--no-daemon)
            if [[ -n "$MAX_WORKERS" ]]; then
              extra+=("--max-workers=$MAX_WORKERS")
            fi
            if [[ -n "$GRADLE_JVMARGS" ]]; then
              extra+=("-Dorg.gradle.jvmargs=$GRADLE_JVMARGS")
            fi
            if [[ -n "$KOTLIN_DAEMON_JVMARGS" ]]; then
              extra+=("-Pkotlin.daemon.jvmargs=$KOTLIN_DAEMON_JVMARGS")
            fi
          fi
          # Which token Gradle gets decides whether private packages resolve,
          # so the log of a failed resolution says which one it was.
          echo "GitHub Packages credentials for Gradle: GITHUB_ACTOR=$GITHUB_ACTOR, GITHUB_TOKEN from $TOKEN_SOURCE."
          # The copy in the temp directory is what gradle-log-verdict reads.
          set -f
          # shellcheck disable=SC2086 # word splitting is intended: the second is an argument list
          ./gradlew "$GRADLE_TASK" $GRADLE_ARGS ${extra[@]+"${extra[@]}"} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # A failed upload must not turn a code failure into a job that looks
      # like an infrastructure failure, hence continue-on-error.
      - name: Upload the test and lint reports
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-pr-check-verify-reports-${{ inputs.attempt }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*
            **/build/reports/configuration-cache/**
          retention-days: 14
          # A compile failure produces no report; that is not an error.
          if-no-files-found: ignore
          overwrite: true

      # job-status covers the steps between checkout and the build: when one
      # of them fails, the build is skipped and the job status is failure,
      # which is infra. A build that was skipped on purpose is pass.
      - name: Report the verdict
        id: verdict
        if: ${{ always() }}
        uses: asleep-ai/actions/gradle-log-verdict@android-ci/stage-2
        with:
          log-file: ${{ runner.temp }}/gradle.log
          setup-outcome: ${{ steps.checkout.outcome }}
          build-outcome: ${{ steps.build.outcome }}
          job-status: ${{ job.status }}

  # Builds the release variant so R8, resource shrinking and keep-rule
  # breakage surface on the pull request. The APK is signed with the throwaway
  # key and discarded.
  release-build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.release-build-timeout-minutes }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Remove stale git lock files
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            while IFS= read -r -d '' lock; do
              echo "Removing ${lock#"$GITHUB_WORKSPACE/"}, left by an earlier job on this runner."
              rm -f -- "$lock"
            done < <(find "$GITHUB_WORKSPACE/.git" -type f -name '*.lock' -print0)
          fi

      - uses: actions/checkout@v7
        id: checkout
        with:
          token: ${{ inputs.checkout-submodules != 'false' && secrets.GIT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout-submodules }}
          fetch-depth: 2
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Decide whether to build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
          SKIP_PUSH_BRANCHES: ${{ inputs.release-build-skip-push-branches }}
        run: |
          set -euo pipefail
          python3 - <<'PLAN'
          import os
          import re
          import subprocess

          event = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          before = os.environ.get("BEFORE", "").strip()
          ignored = [line.strip() for line in os.environ.get("PATHS_IGNORE", "").splitlines() if line.strip()]
          skipped_branches = os.environ.get("SKIP_PUSH_BRANCHES", "").replace(",", " ").split()


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, check=False)


          def glob(pattern):
              # The syntax of full-scan-paths: `**/` spans zero or more directories, any
              # other `**` matches anything, `*` and `?` stay within one path segment.
              pattern = re.sub(r"^(\./|/)+", "", pattern)
              regex, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      regex, i = regex + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      regex, i = regex + ".*", i + 2
                  else:
                      regex, i = regex + {"*": "[^/]*", "?": "[^/]"}.get(pattern[i], re.escape(pattern[i])), i + 1
              return re.compile(regex)


          def base_commit():
              """The commit to compare HEAD with, or None and why there is none."""
              if event == "pull_request":
                  # The checkout is the merge commit; its first parent is the base branch.
                  return "HEAD^1", ""
              if event != "push":
                  return None, f"a {event} run always builds"
              if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", before) or set(before) == {"0"}:
                  return None, "the push has no previous commit, as on a new branch"
              if git("cat-file", "-e", before + "^{commit}").returncode != 0:
                  if git("fetch", "--no-tags", "--depth=1", "origin", before).returncode != 0:
                      return None, "the push's previous commit cannot be fetched, as after a force push"
              return before, ""


          def decide():
              base, reason = base_commit()
              if base is None:
                  return True, reason
              diff = git("diff", "--name-only", "--no-renames", "-z", base, "HEAD", "--")
              if diff.returncode != 0:
                  return True, "git cannot list the changed files: " + diff.stderr.decode(errors="replace").strip()
              files = [os.fsdecode(path) for path in diff.stdout.split(b"\0") if path]
              patterns = [glob(pattern) for pattern in ignored]
              code = [path for path in files if not any(pattern.fullmatch(path) for pattern in patterns)]
              if not code:
                  return False, f"all {len(files)} changed file(s) match paths-ignore"
              return True, f"{len(code)} of {len(files)} changed file(s) are outside paths-ignore, the first being {code[0]}"


          build, reason = decide()
          if build and event == "push":
              for branch in skipped_branches:
                  if ref == "refs/heads/" + branch:
                      build, reason = False, f"this build is skipped on a push to {branch}"
          print(f"build={str(build).lower()}: {reason}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"build={str(build).lower()}\n")
          PLAN

      - name: Set up the JDK
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: false
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      - name: Write local.properties
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          LOCAL_PROPERTIES: ${{ inputs.local-properties }}
          SIGNING_KEY: 'true'
        run: |
          set -euo pipefail
          comment='^[[:space:]]*#'
          assignment='^[A-Za-z_][A-Za-z0-9_.]*='
          signing='^(KEYSTORE_FILE|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)='
          lines=()
          number=0
          invalid=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            number=$((number + 1))
            line="${line%$'\r'}"
            if [[ -z "${line//[[:space:]]/}" || "$line" =~ $comment ]]; then
              continue
            fi
            # The line itself is not printed: a value pasted here by mistake stays out of the log.
            if [[ ! "$line" =~ $assignment ]]; then
              echo "::error title=Invalid local-properties::Line $number is not NAME=value."
              invalid=1
            elif [[ "$line" =~ $signing ]]; then
              echo "::error title=Invalid local-properties::Line $number sets ${line%%=*}, which this workflow writes itself."
              invalid=1
            else
              lines+=("$line")
            fi
          done <<< "$LOCAL_PROPERTIES"
          if [[ "$invalid" != 0 ]]; then
            exit 1
          fi
          if [[ "$SIGNING_KEY" != true && "${#lines[@]}" == 0 ]]; then
            echo "Nothing to write: no signing key in this job and no local-properties lines."
            exit 0
          fi

          {
            if [[ "$SIGNING_KEY" == true ]]; then
              keystore="$RUNNER_TEMP/android-pr-check.jks"
              password=android-pr-check
              rm -f "$keystore"
              keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
                -storepass "$password" -keypass "$password" -alias android-pr-check \
                -keyalg RSA -keysize 2048 -validity 30 \
                -dname "CN=Android PR check throwaway key" >&2
              echo "KEYSTORE_FILE=$keystore"
              echo "KEYSTORE_PASSWORD=$password"
              echo "KEY_ALIAS=android-pr-check"
              echo "KEY_PASSWORD=$password"
            fi
            for line in ${lines[@]+"${lines[@]}"}; do
              printf '%s\n' "$line"
            done
          } > local.properties
          echo "Wrote local.properties: signing key $SIGNING_KEY, ${#lines[@]} caller line(s)."

      - name: Run Gradle
        id: build
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          GRADLE_TASK: ciReleaseBuild
          GRADLE_ARGS: ${{ inputs.release-build-args }}
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GIT_TOKEN != '' && 'GIT_TOKEN' || 'the job token (GIT_TOKEN did not reach this job)' }}
          RUNNER_KIND: ${{ runner.environment }}
          MAX_WORKERS: ${{ inputs.self-hosted-max-workers }}
          GRADLE_JVMARGS: ${{ inputs.self-hosted-gradle-jvmargs }}
          KOTLIN_DAEMON_JVMARGS: ${{ inputs.self-hosted-kotlin-daemon-jvmargs }}
        run: |
          set -euo pipefail
          # A self-hosted host usually has far more cores than a build has
          # memory for: Gradle starts one worker per core by default, and the
          # heap in the caller's gradle.properties is sized for a small
          # machine. --no-daemon: runners on one host share the Gradle user
          # home, so a build could attach to another job's idle daemon, which
          # that job's runner kills when the job ends.
          extra=()
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            extra+=(--no-daemon)
            if [[ -n "$MAX_WORKERS" ]]; then
              extra+=("--max-workers=$MAX_WORKERS")
            fi
            if [[ -n "$GRADLE_JVMARGS" ]]; then
              extra+=("-Dorg.gradle.jvmargs=$GRADLE_JVMARGS")
            fi
            if [[ -n "$KOTLIN_DAEMON_JVMARGS" ]]; then
              extra+=("-Pkotlin.daemon.jvmargs=$KOTLIN_DAEMON_JVMARGS")
            fi
          fi
          # Which token Gradle gets decides whether private packages resolve,
          # so the log of a failed resolution says which one it was.
          echo "GitHub Packages credentials for Gradle: GITHUB_ACTOR=$GITHUB_ACTOR, GITHUB_TOKEN from $TOKEN_SOURCE."
          # The copy in the temp directory is what gradle-log-verdict reads.
          set -f
          # shellcheck disable=SC2086 # word splitting is intended: the second is an argument list
          ./gradlew "$GRADLE_TASK" $GRADLE_ARGS ${extra[@]+"${extra[@]}"} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Upload the test and lint reports
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-pr-check-release-build-reports-${{ inputs.attempt }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*
            **/build/reports/configuration-cache/**
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Report the verdict
        id: verdict
        if: ${{ always() }}
        uses: asleep-ai/actions/gradle-log-verdict@android-ci/stage-2
        with:
          log-file: ${{ runner.temp }}/gradle.log
          setup-outcome: ${{ steps.checkout.outcome }}
          build-outcome: ${{ steps.build.outcome }}
          job-status: ${{ job.status }}
