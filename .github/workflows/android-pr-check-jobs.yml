name: Android PR check jobs

# The jobs of android-pr-check.yml, which calls this file once on the runners
# pick-runner picked and, after an infrastructure failure on self-hosted
# runners, once more on a GitHub-hosted runner. Each job reports a verdict
# (pass, code or infra) that decides whether the second call happens.
#
# This file is internal to android-pr-check.yml: call that workflow, not this
# one. The inputs are documented there and in android-ci/README.md.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on as JSON: a label array, or a quoted runner label such as "ubuntu-latest"'
        required: true
        type: string
      attempt:
        description: 'primary or fallback. Both calls share one workflow run, so artifact names carry it.'
        required: true
        type: string
      java-version:
        required: true
        type: string
      java-distribution:
        required: true
        type: string
      mise-version:
        required: true
        type: string
      full-scan-paths:
        required: false
        type: string
        default: ''
      verify-task:
        required: true
        type: string
      verify-args:
        required: false
        type: string
        default: ''
      release-build-task:
        required: true
        type: string
      release-build-args:
        required: false
        type: string
        default: ''
      release-build-skip-push-branches:
        required: false
        type: string
        default: ''
      checkout-submodules:
        required: true
        type: string
      local-properties:
        required: false
        type: string
        default: ''
      paths-ignore:
        required: false
        type: string
        default: ''
      code-style-timeout-minutes:
        required: true
        type: number
      verify-timeout-minutes:
        required: true
        type: number
      release-build-timeout-minutes:
        required: true
        type: number
      self-hosted-max-workers:
        required: false
        type: string
        default: ''
      self-hosted-gradle-jvmargs:
        required: false
        type: string
        default: ''
      self-hosted-kotlin-daemon-jvmargs:
        required: false
        type: string
        default: ''
      report-retention-days:
        required: true
        type: number
    secrets:
      GIT_TOKEN:
        description: 'Optional. Token for private submodules and private GitHub Packages.'
        required: false
    outputs:
      code-style-verdict:
        description: 'pass, code or infra; empty when the job never reported (its runner went away)'
        value: ${{ jobs.code-style.outputs.verdict }}
      verify-verdict:
        description: 'pass, code or infra; empty when the job never reported (its runner went away)'
        value: ${{ jobs.verify.outputs.verdict }}
      release-build-verdict:
        description: 'pass, code or infra; empty when the job never reported (its runner went away)'
        value: ${{ jobs.release-build.outputs.verdict }}

permissions:
  contents: read
  packages: read
  # dorny/paths-filter lists a pull request's files through the API.
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  code-style:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.code-style-timeout-minutes }}
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # A self-hosted runner keeps its work folder between jobs. A job that is
      # cancelled while git is writing leaves a lock file behind, in the
      # repository or in a submodule, and every later checkout in that folder
      # fails on it ("index.lock: File exists"). A runner runs one job at a
      # time, so a lock found before checkout has no owner. actions/checkout
      # clears only the repository's own index.lock and shallow.lock.
      - name: Remove stale git lock files
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            while IFS= read -r -d '' lock; do
              echo "Removing ${lock#"$GITHUB_WORKSPACE/"}, left by an earlier job on this runner."
              rm -f -- "$lock"
            done < <(find "$GITHUB_WORKSPACE/.git" -type f -name '*.lock' -print0)
          fi

      # The pull request head, not the merge commit, with full history:
      # pre-commit-changed compares the head with its merge base.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # pre-commit and every tool the caller's hooks need come from the
      # caller's mise configuration.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        id: mise
        with:
          version: ${{ inputs.mise-version }}
          # A self-hosted runner keeps the installed tools; restoring the
          # Actions cache there only costs time.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Run pre-commit on the changed files
        id: pre-commit
        uses: asleep-ai/actions/pre-commit-changed@android-ci/stage-2
        with:
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          # Always passed, so an empty value means no full runs, not the
          # action's default; android-pr-check.yml carries that default.
          full-scan-paths: ${{ inputs.full-scan-paths }}

      # Setup that failed (checkout, tool install) is infra; a failed hook is
      # the change's own. A hook run cut off by the job timeout (cancelled) is
      # infra too.
      - name: Report the verdict
        id: verdict
        if: ${{ always() }}
        env:
          SETUP: ${{ steps.checkout.outcome }} ${{ steps.mise.outcome }}
          CHECK: ${{ steps.pre-commit.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SETUP" != "success success" ]]; then
            verdict=infra
          elif [[ "$CHECK" == success ]]; then
            verdict=pass
          elif [[ "$CHECK" == failure ]]; then
            verdict=code
          else
            verdict=infra
          fi
          echo "verdict=$verdict (setup: $SETUP, pre-commit: $CHECK)"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

  # verify and release-build share every step up to the report upload; only
  # the task, its arguments and the skip rule differ. android-ci's tests fail
  # when the two copies drift apart.
  verify:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.verify-timeout-minutes }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Remove stale git lock files
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            while IFS= read -r -d '' lock; do
              echo "Removing ${lock#"$GITHUB_WORKSPACE/"}, left by an earlier job on this runner."
              rm -f -- "$lock"
            done < <(find "$GITHUB_WORKSPACE/.git" -type f -name '*.lock' -print0)
          fi

      # GIT_TOKEN reaches private submodules; the job token is used when the
      # caller has none. The token stays in the clone only on a push, where
      # paths-filter fetches the previous commit with git; for a pull request
      # it lists the files through the API, and the pull request's code never
      # finds the token in the clone.
      - uses: actions/checkout@v7
        id: checkout
        with:
          token: ${{ secrets.GIT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout-submodules }}
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Prepare the path filter
        id: paths
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          set -euo pipefail
          # A file counts as a code change when it matches '**' and none of the
          # ignored patterns (predicate-quantifier: every, below).
          quote="'"
          {
            echo 'filters<<ANDROID_PR_CHECK_FILTERS'
            echo 'code:'
            echo "  - '**'"
            while IFS= read -r pattern || [[ -n "$pattern" ]]; do
              pattern="${pattern%$'\r'}"
              pattern="${pattern#"${pattern%%[![:space:]]*}"}"
              pattern="${pattern%"${pattern##*[![:space:]]}"}"
              if [[ -n "$pattern" ]]; then
                printf "  - '!%s'\n" "${pattern//$quote/$quote$quote}"
              fi
            done <<< "$PATHS_IGNORE"
            echo 'ANDROID_PR_CHECK_FILTERS'
          } >> "$GITHUB_OUTPUT"

      # Other events (a manual run, a schedule) have no change to compare and
      # always build.
      - name: Detect code changes
        id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'push' }}
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: ${{ steps.paths.outputs.filters }}

      # A skipped build still ends in a successful job, so a required check
      # built on this workflow reports on a documentation-only change too.
      - name: Decide whether to build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
          SKIP_PUSH_BRANCHES: ''
        run: |
          set -euo pipefail
          build=true
          reason="a $EVENT_NAME run always builds"
          case "$EVENT_NAME" in
            pull_request | pull_request_target | push)
              if [[ "$CODE_CHANGED" == true ]]; then
                reason="a file outside paths-ignore changed"
              else
                build=false
                reason="every changed file matches paths-ignore"
              fi
              ;;
          esac
          if [[ "$build" == true && "$EVENT_NAME" == push ]]; then
            set -f
            for branch in ${SKIP_PUSH_BRANCHES//,/ }; do
              if [[ "$REF" == "refs/heads/$branch" ]]; then
                build=false
                reason="this build is skipped on a push to $branch"
              fi
            done
          fi
          echo "build=$build: $reason"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Set up the JDK
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          # On a GitHub-hosted runner the run restores the Gradle user home
          # from the Actions cache and saves it again. A self-hosted runner
          # keeps its Gradle user home between jobs, so the Actions cache there
          # only adds restore and save time.
          cache-read-only: false
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      # The key exists only in this job's temp directory. It lets the build
      # sign without any secret, so pull requests from forks and Dependabot
      # build the same way. local-properties holds placeholder values for a
      # pull request build, never secrets.
      - name: Write local.properties with a throwaway signing key
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          LOCAL_PROPERTIES: ${{ inputs.local-properties }}
        run: |
          set -euo pipefail
          comment='^[[:space:]]*#'
          assignment='^[A-Za-z_][A-Za-z0-9_.]*='
          signing='^(KEYSTORE_FILE|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)='
          lines=()
          number=0
          invalid=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            number=$((number + 1))
            line="${line%$'\r'}"
            if [[ -z "${line//[[:space:]]/}" || "$line" =~ $comment ]]; then
              continue
            fi
            # The line itself is not printed: a value pasted here by mistake stays out of the log.
            if [[ ! "$line" =~ $assignment ]]; then
              echo "::error title=Invalid local-properties::Line $number is not NAME=value."
              invalid=1
            elif [[ "$line" =~ $signing ]]; then
              echo "::error title=Invalid local-properties::Line $number sets ${line%%=*}, which this workflow writes itself."
              invalid=1
            else
              lines+=("$line")
            fi
          done <<< "$LOCAL_PROPERTIES"
          if [[ "$invalid" != 0 ]]; then
            exit 1
          fi

          keystore="$RUNNER_TEMP/android-pr-check.jks"
          password=android-pr-check
          rm -f "$keystore"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -storepass "$password" -keypass "$password" -alias android-pr-check \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Android PR check throwaway key"
          {
            echo "KEYSTORE_FILE=$keystore"
            echo "KEYSTORE_PASSWORD=$password"
            echo "KEY_ALIAS=android-pr-check"
            echo "KEY_PASSWORD=$password"
            for line in ${lines[@]+"${lines[@]}"}; do
              printf '%s\n' "$line"
            done
          } > local.properties
          echo "Wrote local.properties: the four signing keys and ${#lines[@]} caller line(s)."

      - name: Run Gradle
        id: build
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          GRADLE_TASK: ${{ inputs.verify-task }}
          # --continue reports build, test and lint failures of one run together.
          GRADLE_ARGS: --continue ${{ inputs.verify-args }}
          # Scoped to this step: Gradle reads GITHUB_ACTOR and GITHUB_TOKEN as
          # GitHub Packages credentials. The job token cannot read packages of
          # other repositories, so GIT_TOKEN wins when the caller has it.
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GIT_TOKEN != '' && 'GIT_TOKEN' || 'the job token (GIT_TOKEN did not reach this job)' }}
          RUNNER_KIND: ${{ runner.environment }}
          MAX_WORKERS: ${{ inputs.self-hosted-max-workers }}
          GRADLE_JVMARGS: ${{ inputs.self-hosted-gradle-jvmargs }}
          KOTLIN_DAEMON_JVMARGS: ${{ inputs.self-hosted-kotlin-daemon-jvmargs }}
        run: |
          set -euo pipefail
          # A self-hosted host usually has far more cores than a build has
          # memory for: Gradle starts one worker per core by default, and the
          # heap in the caller's gradle.properties is sized for a small
          # machine. --no-daemon: runners on one host share the Gradle user
          # home, so a build could attach to another job's idle daemon, which
          # that job's runner kills when the job ends.
          extra=()
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            extra+=(--no-daemon)
            if [[ -n "$MAX_WORKERS" ]]; then
              extra+=("--max-workers=$MAX_WORKERS")
            fi
            if [[ -n "$GRADLE_JVMARGS" ]]; then
              extra+=("-Dorg.gradle.jvmargs=$GRADLE_JVMARGS")
            fi
            if [[ -n "$KOTLIN_DAEMON_JVMARGS" ]]; then
              extra+=("-Pkotlin.daemon.jvmargs=$KOTLIN_DAEMON_JVMARGS")
            fi
          fi
          # Which token Gradle gets decides whether private packages resolve,
          # so the log of a failed resolution says which one it was.
          echo "GitHub Packages credentials for Gradle: GITHUB_ACTOR=$GITHUB_ACTOR, GITHUB_TOKEN from $TOKEN_SOURCE."
          # The copy in the temp directory is what gradle-log-verdict reads.
          set -f
          # shellcheck disable=SC2086 # word splitting is intended: both are argument lists
          ./gradlew $GRADLE_TASK $GRADLE_ARGS ${extra[@]+"${extra[@]}"} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # A failed upload must not turn a code failure into a job that looks
      # like an infrastructure failure, hence continue-on-error.
      - name: Upload the test and lint reports
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-pr-check-verify-reports-${{ inputs.attempt }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*
            **/build/reports/configuration-cache/**
          retention-days: ${{ inputs.report-retention-days }}
          # A compile failure produces no report; that is not an error.
          if-no-files-found: ignore
          overwrite: true

      # job-status covers the steps between checkout and the build: when one
      # of them fails, the build is skipped and the job status is failure,
      # which is infra. A build that was skipped on purpose is pass.
      - name: Report the verdict
        id: verdict
        if: ${{ always() }}
        uses: asleep-ai/actions/gradle-log-verdict@android-ci/stage-2
        with:
          log-file: ${{ runner.temp }}/gradle.log
          setup-outcome: ${{ steps.checkout.outcome }}
          build-outcome: ${{ steps.build.outcome }}
          job-status: ${{ job.status }}

  # Builds the release variant so R8, resource shrinking and keep-rule
  # breakage surface on the pull request. The APK is signed with the throwaway
  # key and discarded.
  release-build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.release-build-timeout-minutes }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Remove stale git lock files
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          set -euo pipefail
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            while IFS= read -r -d '' lock; do
              echo "Removing ${lock#"$GITHUB_WORKSPACE/"}, left by an earlier job on this runner."
              rm -f -- "$lock"
            done < <(find "$GITHUB_WORKSPACE/.git" -type f -name '*.lock' -print0)
          fi

      - uses: actions/checkout@v7
        id: checkout
        with:
          token: ${{ secrets.GIT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout-submodules }}
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Prepare the path filter
        id: paths
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          set -euo pipefail
          # A file counts as a code change when it matches '**' and none of the
          # ignored patterns (predicate-quantifier: every, below).
          quote="'"
          {
            echo 'filters<<ANDROID_PR_CHECK_FILTERS'
            echo 'code:'
            echo "  - '**'"
            while IFS= read -r pattern || [[ -n "$pattern" ]]; do
              pattern="${pattern%$'\r'}"
              pattern="${pattern#"${pattern%%[![:space:]]*}"}"
              pattern="${pattern%"${pattern##*[![:space:]]}"}"
              if [[ -n "$pattern" ]]; then
                printf "  - '!%s'\n" "${pattern//$quote/$quote$quote}"
              fi
            done <<< "$PATHS_IGNORE"
            echo 'ANDROID_PR_CHECK_FILTERS'
          } >> "$GITHUB_OUTPUT"

      - name: Detect code changes
        id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'push' }}
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: ${{ steps.paths.outputs.filters }}

      - name: Decide whether to build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
          SKIP_PUSH_BRANCHES: ${{ inputs.release-build-skip-push-branches }}
        run: |
          set -euo pipefail
          build=true
          reason="a $EVENT_NAME run always builds"
          case "$EVENT_NAME" in
            pull_request | pull_request_target | push)
              if [[ "$CODE_CHANGED" == true ]]; then
                reason="a file outside paths-ignore changed"
              else
                build=false
                reason="every changed file matches paths-ignore"
              fi
              ;;
          esac
          if [[ "$build" == true && "$EVENT_NAME" == push ]]; then
            set -f
            for branch in ${SKIP_PUSH_BRANCHES//,/ }; do
              if [[ "$REF" == "refs/heads/$branch" ]]; then
                build=false
                reason="this build is skipped on a push to $branch"
              fi
            done
          fi
          echo "build=$build: $reason"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Set up the JDK
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        if: ${{ steps.plan.outputs.build == 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-disabled: ${{ runner.environment == 'self-hosted' }}

      - name: Write local.properties with a throwaway signing key
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          LOCAL_PROPERTIES: ${{ inputs.local-properties }}
        run: |
          set -euo pipefail
          comment='^[[:space:]]*#'
          assignment='^[A-Za-z_][A-Za-z0-9_.]*='
          signing='^(KEYSTORE_FILE|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)='
          lines=()
          number=0
          invalid=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            number=$((number + 1))
            line="${line%$'\r'}"
            if [[ -z "${line//[[:space:]]/}" || "$line" =~ $comment ]]; then
              continue
            fi
            # The line itself is not printed: a value pasted here by mistake stays out of the log.
            if [[ ! "$line" =~ $assignment ]]; then
              echo "::error title=Invalid local-properties::Line $number is not NAME=value."
              invalid=1
            elif [[ "$line" =~ $signing ]]; then
              echo "::error title=Invalid local-properties::Line $number sets ${line%%=*}, which this workflow writes itself."
              invalid=1
            else
              lines+=("$line")
            fi
          done <<< "$LOCAL_PROPERTIES"
          if [[ "$invalid" != 0 ]]; then
            exit 1
          fi

          keystore="$RUNNER_TEMP/android-pr-check.jks"
          password=android-pr-check
          rm -f "$keystore"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -storepass "$password" -keypass "$password" -alias android-pr-check \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Android PR check throwaway key"
          {
            echo "KEYSTORE_FILE=$keystore"
            echo "KEYSTORE_PASSWORD=$password"
            echo "KEY_ALIAS=android-pr-check"
            echo "KEY_PASSWORD=$password"
            for line in ${lines[@]+"${lines[@]}"}; do
              printf '%s\n' "$line"
            done
          } > local.properties
          echo "Wrote local.properties: the four signing keys and ${#lines[@]} caller line(s)."

      - name: Run Gradle
        id: build
        if: ${{ steps.plan.outputs.build == 'true' }}
        env:
          GRADLE_TASK: ${{ inputs.release-build-task }}
          GRADLE_ARGS: ${{ inputs.release-build-args }}
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GIT_TOKEN != '' && 'GIT_TOKEN' || 'the job token (GIT_TOKEN did not reach this job)' }}
          RUNNER_KIND: ${{ runner.environment }}
          MAX_WORKERS: ${{ inputs.self-hosted-max-workers }}
          GRADLE_JVMARGS: ${{ inputs.self-hosted-gradle-jvmargs }}
          KOTLIN_DAEMON_JVMARGS: ${{ inputs.self-hosted-kotlin-daemon-jvmargs }}
        run: |
          set -euo pipefail
          # A self-hosted host usually has far more cores than a build has
          # memory for: Gradle starts one worker per core by default, and the
          # heap in the caller's gradle.properties is sized for a small
          # machine. --no-daemon: runners on one host share the Gradle user
          # home, so a build could attach to another job's idle daemon, which
          # that job's runner kills when the job ends.
          extra=()
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            extra+=(--no-daemon)
            if [[ -n "$MAX_WORKERS" ]]; then
              extra+=("--max-workers=$MAX_WORKERS")
            fi
            if [[ -n "$GRADLE_JVMARGS" ]]; then
              extra+=("-Dorg.gradle.jvmargs=$GRADLE_JVMARGS")
            fi
            if [[ -n "$KOTLIN_DAEMON_JVMARGS" ]]; then
              extra+=("-Pkotlin.daemon.jvmargs=$KOTLIN_DAEMON_JVMARGS")
            fi
          fi
          # Which token Gradle gets decides whether private packages resolve,
          # so the log of a failed resolution says which one it was.
          echo "GitHub Packages credentials for Gradle: GITHUB_ACTOR=$GITHUB_ACTOR, GITHUB_TOKEN from $TOKEN_SOURCE."
          # The copy in the temp directory is what gradle-log-verdict reads.
          set -f
          # shellcheck disable=SC2086 # word splitting is intended: both are argument lists
          ./gradlew $GRADLE_TASK $GRADLE_ARGS ${extra[@]+"${extra[@]}"} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Upload the test and lint reports
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: android-pr-check-release-build-reports-${{ inputs.attempt }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*
            **/build/reports/configuration-cache/**
          retention-days: ${{ inputs.report-retention-days }}
          if-no-files-found: ignore
          overwrite: true

      - name: Report the verdict
        id: verdict
        if: ${{ always() }}
        uses: asleep-ai/actions/gradle-log-verdict@android-ci/stage-2
        with:
          log-file: ${{ runner.temp }}/gradle.log
