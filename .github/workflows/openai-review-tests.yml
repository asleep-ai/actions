name: OpenAI review unit tests
on:
  pull_request:
    paths: ['openai-review/**', '.github/workflows/openai-review-tests.yml']
  push:
    branches: [main]
    paths: ['openai-review/**', '.github/workflows/openai-review-tests.yml']
permissions:
  contents: read
concurrency:
  group: review-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s openai-review -p 'test_*.py' -v
