name: Android release build

# The build job of android-release.yml and of android-qa.yml. Each calls this
# file once on the runner it picked and, after an infrastructure failure on a
# self-hosted runner, once more on a GitHub-hosted runner. The job builds a
# release or preview tag with ./gradlew ciRelease, or a branch commit with
# ./gradlew ciQa (a QA build or a label build), signs with the caller's
# keystore, checks every APK the build left and uploads them as one artifact
# for the publish job.
#
# Every build starts from an emptied work folder and runs every task. A
# release or a preview also starts from an empty Gradle user home, and so does
# a QA or label build unless its caller asks for more. Asked for it
# (gradle-home), a QA or label build on a self-hosted runner uses the QA home
# of its repository instead, a directory that only such builds use, one at a
# time, and that is kept between them: see the step that chooses the home.
#
# This file is internal to those two workflows: call them, not this one. The
# inputs are documented there and in android-ci/README.md.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on as JSON: a label array, or a quoted runner label such as "ubuntu-latest"'
        required: true
        type: string
      attempt:
        description: >-
          primary or fallback. Both calls share one workflow run, so the
          artifact with the signed APKs is named android-release-apk-<attempt>
          or android-qa-apk-<attempt>.
        required: true
        type: string
      kind:
        description: >-
          What is built: release or preview (a tag, with ciRelease), qa or
          label (a branch commit, with ciQa). The build gets it as
          -PciBuildKind. It also decides the name of the artifact and how long
          it is kept: 90 days for a release or preview, 1 day for a QA or
          label build, whose publish job deletes it.
        required: true
        type: string
      environment:
        description: 'Empty runs the job in no environment.'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          What is checked out: refs/tags/<tag> for a release, the id of the
          commit for a QA build.
        required: true
        type: string
      sha:
        description: 'The commit the build was planned for.'
        required: true
        type: string
      sentry-upload:
        description: >-
          Whether the Gradle step gets SENTRY_AUTH_TOKEN, whose presence turns
          the mapping upload on in the caller's build.
        required: false
        type: boolean
        default: true
      version-name:
        required: true
        type: string
      version-code:
        required: true
        type: string
      java-version:
        required: true
        type: string
      java-distribution:
        required: true
        type: string
      checkout-submodules:
        required: true
        type: string
      local-properties-secrets:
        required: false
        type: string
        default: ''
      required-secrets:
        required: false
        type: string
        default: ''
      gradle-args:
        required: false
        type: string
        default: ''
      apk-directory:
        required: true
        type: string
      expected-cert-sha256:
        required: false
        type: string
        default: ''
      build-tools-version:
        required: false
        type: string
        default: ''
      build-timeout-minutes:
        required: true
        type: number
      gradle-home:
        description: >-
          cold, warm or reset. cold, the default: a Gradle user home of this
          job, empty at its start and gone at its end. warm: the QA home of
          the repository, which is kept between jobs. reset: that home,
          emptied first. Anything but cold is honoured only for kind qa or
          label, on a self-hosted runner, in a run that a push or a person
          started on the default branch of the repository or on
          release/<major>.x, and while no other build uses the home. Every
          other build is cold, whatever the value. android-release.yml does
          not pass it.
        required: false
        type: string
        default: cold
      self-hosted-max-workers:
        required: false
        type: string
        default: ''
      self-hosted-gradle-jvmargs:
        required: false
        type: string
        default: ''
      self-hosted-kotlin-daemon-jvmargs:
        required: false
        type: string
        default: ''
    outputs:
      verdict:
        description: >-
          pass, code or infra; empty when the job never reported (its runner
          went away). code also stands for a missing secret or variable and
          for APKs that cannot be released: another runner would end the same
          way.
        value: ${{ jobs.build.outputs.verdict }}

# No permissions are declared here: the build job has those of the job that
# calls this file, and a called workflow can only be given less than its
# caller has, never more. android-release.yml gives contents: read and
# packages: read. android-qa.yml gives its first build actions: read on top,
# for the one question the step that chooses the Gradle user home asks
# GitHub; a declaration here would have to name it for the release too, whose
# calling files do not grant it. android-ci's tests pin what the two give.

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    # The signing secrets are read from this environment when they are kept
    # there. Its protection rules (reviewers, allowed branches and tags) apply
    # to this job.
    environment: ${{ inputs.environment }}
    # No output of this job may hold text that could equal a secret: the runner
    # drops an output that contains the value of one, a key alias for instance.
    #
    # code without asking gradle-log-verdict in two cases, because another
    # runner would end the same way: a missing secret, and APKs the build left
    # that cannot be released as they are.
    #
    # code as well when the plan of the calling workflow passed something
    # empty: the same plan would pass it to the second build.
    #
    # The verdict does not depend on the Gradle user home. A Gradle run in the
    # QA home that failed for the code is code, as anywhere, and no second
    # build follows it. What is done about a home that may be to blame is
    # in the step that tidies or discards it.
    outputs:
      verdict: ${{ (steps.planned.outcome == 'failure' || steps.values.outcome == 'failure' || steps.apk.outputs.refused == 'true') && 'code' || steps.verdict.outputs.verdict }}
    steps:
      # A self-hosted runner keeps its work folder between jobs, and the jobs
      # before this one may have built a pull request: files in the folder, git
      # hooks and git configuration are all theirs. Nothing of that is trusted
      # by a job that signs, so the folder is emptied before any other step
      # runs in it, and the checkout below is a fresh clone. A GitHub-hosted
      # runner starts empty.
      - name: Empty the work folder
        id: workspace
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_KIND" != self-hosted ]]; then
            echo "Not a self-hosted runner: the work folder is new."
            exit 0
          fi
          if [[ -z "${GITHUB_WORKSPACE:-}" || ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "::error::GITHUB_WORKSPACE is not a directory."
            exit 1
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          echo "Emptied $GITHUB_WORKSPACE."

      # What the plan job of the calling workflow decided arrives as inputs.
      # An empty one means the runner dropped a job output there: it does that
      # to an output that contains the value of a secret, without failing the
      # job that set it. The build would then fail much later, on a version
      # Gradle cannot read, with nothing that names the reason.
      - name: Check what was planned
        id: planned
        env:
          KIND: ${{ inputs.kind }}
          REF: ${{ inputs.ref }}
          PLANNED_SHA: ${{ inputs.sha }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          missing=""
          for name in KIND REF PLANNED_SHA VERSION_NAME VERSION_CODE; do
            if [[ -z "${!name}" ]]; then
              missing="${missing:+$missing, }$name"
            fi
          done
          # A version name that ends in a hyphen or starts with one lost a part.
          if [[ -z "$missing" && ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+(-[a-z0-9]+)*\.[0-9]+)?$ ]]; then
            missing="part of VERSION_NAME ($VERSION_NAME)"
          fi
          if [[ -n "$missing" ]]; then
            echo "::error title=The plan is incomplete::Empty: $missing. The plan job passed, so the runner dropped an output: it does that to an output that contains the value of a secret. Look for a secret whose value is a short word or number."
            exit 1
          fi
          case "$KIND" in
            release|preview|qa|label) ;;
            *)
              echo "::error::kind is none of release, preview, qa and label."
              exit 1
              ;;
          esac
          echo "Planned: $KIND build $VERSION_NAME ($VERSION_CODE) of $REF at $PLANNED_SHA."

      # Before anything is checked out, so a build that cannot be made
      # stops here and names everything that is missing at once. The four
      # signing values are always needed; the caller lists the rest. A name is
      # looked up among the secrets and then among the variables this job can
      # read. Only names are printed, never a value.
      #
      # The values that go to local.properties are written here, to a file in
      # the job's temp directory, so that this is the only step that sees
      # every secret. The step that needs the file moves it into place.
      #
      # python3 -I: the script comes from standard input, and without -I
      # Python would look for the modules it imports in the work folder first.
      - name: Check the secrets and variables
        id: values
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
          LOCAL_PROPERTIES_SECRETS: ${{ inputs.local-properties-secrets }}
          REQUIRED_SECRETS: ${{ inputs.required-secrets }}
        run: |
          set -euo pipefail
          python3 -I - <<'VALUES'
          import json
          import os
          import re
          import sys

          SIGNING = ["KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"]
          # KEYSTORE_FILE is the path of the decoded keystore, which a later step writes.
          RESERVED = set(SIGNING) | {"KEYSTORE_FILE"}
          NAME = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")


          def names(variable):
              return os.environ.get(variable, "").replace(",", " ").split()


          def escape(value):
              # java.util.Properties reads the file as ISO-8859-1, takes a backslash as the start of
              # an escape and drops the whitespace a value starts with. Written this way, the build
              # reads back exactly the value that was stored.
              escaped = []
              for index, character in enumerate(value):
                  if character == "\\":
                      escaped.append("\\\\")
                  elif character in "\n\r\t\f":
                      escaped.append({"\n": "\\n", "\r": "\\r", "\t": "\\t", "\f": "\\f"}[character])
                  elif character == " " and index == 0:
                      escaped.append("\\ ")
                  elif " " <= character <= "~":
                      escaped.append(character)
                  else:
                      code = character.encode("utf-16-be").hex()
                      escaped.append("".join("\\u" + code[i:i + 4] for i in range(0, len(code), 4)))
              return "".join(escaped)


          secrets = json.loads(os.environ.get("SECRETS_JSON") or "{}")
          variables = json.loads(os.environ.get("VARS_JSON") or "{}")
          listed = names("LOCAL_PROPERTIES_SECRETS")
          required = names("REQUIRED_SECRETS")

          invalid = [name for name in listed + required if not NAME.fullmatch(name)]
          if invalid:
              # A value pasted where a name belongs must not reach the log.
              print(f"::error title=Invalid input::{len(invalid)} entr{'y is' if len(invalid) == 1 else 'ies are'} "
                    "not the name of a secret or variable. local-properties-secrets and required-secrets take "
                    "names, separated by whitespace or commas.")
              sys.exit(1)
          reserved = sorted(set(listed) & RESERVED)
          if reserved:
              print(f"::error title=Invalid input::local-properties-secrets lists {', '.join(reserved)}, which this "
                    "workflow writes itself.")
              sys.exit(1)


          def value(name):
              found = secrets.get(name) or variables.get(name) or ""
              return found if isinstance(found, str) else ""


          wanted = list(dict.fromkeys(SIGNING + listed + required))
          missing = [name for name in wanted if not value(name)]
          if missing:
              print(f"::error title=Missing secrets or variables::{', '.join(missing)}. Each has to be a secret or a "
                    "variable of the repository, its organization or the environment of this job, and the calling "
                    "workflow has to pass its secrets with `secrets: inherit`.")
              sys.exit(1)

          written = ["KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"] + list(dict.fromkeys(listed))
          path = os.path.join(os.environ["RUNNER_TEMP"], "android-release.properties")
          try:
              os.unlink(path)
          except FileNotFoundError:
              pass
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w", encoding="ascii") as file:
              for name in written:
                  file.write(f"{name}={escape(value(name))}\n")
          print(f"All {len(wanted)} values are present: {', '.join(wanted)}.")
          print(f"Prepared {len(written)} local.properties entries: {', '.join(written)}.")
          VALUES

      # GIT_TOKEN is used only when submodules are checked out: it reaches
      # private ones, and the job token reads the repository itself. No token
      # stays in the clone.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.ref }}
          token: ${{ inputs.checkout-submodules != 'false' && secrets.GIT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout-submodules }}
          persist-credentials: false

      # The version and the build were planned for one commit. A tag that
      # was moved since then is another release.
      - name: Check the commit
        id: commit
        env:
          REF: ${{ inputs.ref }}
          PLANNED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [[ "$head" != "$PLANNED_SHA" ]]; then
            echo "::error::$REF is at $head, and this build was planned for $PLANNED_SHA. The ref was moved; start the run again."
            exit 1
          fi
          echo "Building $REF at $head."

      - name: Set up the JDK
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      # Cold, for every release and preview and wherever nothing else is asked
      # for: a Gradle user home in the job's temp directory, which the runner
      # empties before and after every job. It starts without init scripts,
      # dependency cache, build cache or daemons of any other job, and what
      # this build leaves in it, values of local.properties included, is gone
      # when the job ends.
      #
      # Warm, for a QA or label build whose caller asks for it (gradle-home):
      # the QA home of the repository,
      # <HOME>/android-qa-gradle/<owner>/<repo>/home, a directory of the
      # runner's user that no other step of these workflows names. It is kept
      # between jobs, so a build finds the Gradle distribution, the
      # dependencies and what Gradle derived from them already there.
      #
      # Who may use it is decided here, from the run alone: no input says
      # which branch counts. A QA or label build, on a self-hosted runner, in
      # a run that a push or a person started (github.event_name) on the
      # default branch of the calling repository or on release/<major>.x
      # (github.ref against github.event.repository.default_branch). Those
      # are the builds of merged code that are signed anyway. Every other
      # build is cold whatever was asked for: a release, a preview, a
      # GitHub-hosted runner, any other event, any other ref. A repository
      # that cuts its releases from another branch than its default branch
      # builds that branch cold.
      #
      # One build at a time. The file `in-use` next to the home names the
      # build that has it: its run, the attempt of the run and the runner it
      # is on. It is made in one step (a hard link, which fails when the name
      # exists), so two builds never both get the home, and a build that
      # finds it taken is cold. The build deletes the file at its end.
      #
      # A job that dies does not get to its end, and neither does one that
      # its runner stops: no step of it runs any more, the ones with always()
      # included. So a build that finds the home taken asks GitHub for the
      # jobs of the run attempt the file names. When every job of it that ran
      # on the named runner is completed, the build that took the home is
      # over, and this one takes the home over. That needs a token that may
      # read the runs of the repository (actions: read); android-qa.yml gives
      # it. Whenever GitHub cannot be asked or does not say that the job is
      # over, the file counts until the time written in it: the timeout of
      # the job and ten minutes, or two minutes after a Gradle run that was
      # cancelled. So nothing is deleted or discarded under a build that
      # runs, and no build reads what another one is writing.
      #
      # Only a home that a build finished in is used again. The file `intact`
      # next to the home says so: the build takes it away before it uses the
      # home and puts it back when it has left the home tidy. A home without
      # it was left by a job that died, whatever became of `in-use`, and is
      # discarded: an entry that a killed build left half written can fail
      # the next build in a way that reads like an error in the code.
      #
      # One home per repository, for all its lines and for every runner of a
      # host that runs as the same user: the same path on each of them. The
      # pull request builds never use this directory, and this build never
      # uses theirs.
      #
      # The home holds caches and nothing else. Before the build, everything
      # in it is deleted but caches, wrapper and jdks, and inside those the
      # local build cache and what a Gradle distribution reads as
      # configuration (its init.d and its gradle.properties). Not only when
      # something looks wrong: whatever the home held, the build starts with
      # no init script and no gradle.properties in it. setup-gradle writes
      # its own init scripts in the next step, and no code of the repository
      # runs between that step and Gradle. A symbolic link is how another
      # home would get back in. One in place of the home, up to two levels
      # inside it, up to two levels below caches or up to three below
      # wrapper/dists ends in an empty home: that covers every directory the
      # deleting walks through, so it never deletes in another home, and the
      # places a whole cache or a Gradle distribution would be linked at. So
      # does gradle-home reset.
      #
      # That guards against accidents, not against a build that means harm:
      # the jars in caches and wrapper are code the next build runs, and
      # nothing here checks them. What protects the home is who can write to
      # it.
      #
      # Nothing about the QA home fails the step: whatever keeps it from
      # being used ends in a cold build, and in a warning unless the reason
      # is that another build has the home.
      - name: Choose the Gradle user home
        id: gradle-home
        env:
          GRADLE_HOME: ${{ inputs.gradle-home }}
          KIND: ${{ inputs.kind }}
          RUNNER_KIND: ${{ runner.environment }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BUILD_TIMEOUT_MINUTES: ${{ inputs.build-timeout-minutes }}
          # Only to ask whether the job that has the QA home is over.
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cold="$RUNNER_TEMP/gradle-user-home"
          rm -rf "$cold"
          use_cold() {
            mkdir -p "$cold"
            echo "GRADLE_USER_HOME=$cold" >> "$GITHUB_ENV"
            echo "warm=false" >> "$GITHUB_OUTPUT"
            echo "Gradle user home: $cold (cold: $1)"
            exit 0
          }
          # The build was meant to be warm and is not: the host has to hear of it.
          give_up() {
            echo "::warning title=QA Gradle home not used::$1 The build is cold."
            use_cold "the QA home cannot be used"
          }

          case "$GRADLE_HOME" in
            warm|reset) ;;
            cold) use_cold "gradle-home is cold" ;;
            *) give_up "gradle-home is none of cold, warm and reset." ;;
          esac
          if [[ "$KIND" != qa && "$KIND" != label ]]; then
            use_cold "a release or a preview is built cold, whatever gradle-home says"
          fi
          if [[ "$RUNNER_KIND" != self-hosted ]]; then
            use_cold "a GitHub-hosted runner keeps nothing between jobs"
          fi
          # From here on it is a QA build that asked for the home and does
          # not get it. Its caller did not plan for that, so each reason is a
          # warning. The event, the ref and the default branch are the run's:
          # no caller can say that its run is a push to a release branch.
          if [[ "$EVENT_NAME" != push && "$EVENT_NAME" != workflow_dispatch ]]; then
            give_up "Only a run that a push or a person started uses the QA home, and this is a $EVENT_NAME run."
          fi
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            give_up "The run does not name the default branch of the repository."
          fi
          release_line='^refs/heads/release/(0|[1-9][0-9]*)\.x$'
          if [[ "$RUN_REF" != "refs/heads/$DEFAULT_BRANCH" && ! "$RUN_REF" =~ $release_line ]]; then
            give_up "Only a run on the default branch of the repository ($DEFAULT_BRANCH) or on release/<major>.x uses the QA home, and this run is on $RUN_REF."
          fi

          # <owner>/<repo>, as two directories: no two repositories share a
          # path. The step that tidies the home accepts the same names.
          repository_name='^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$'
          if [[ ! "$REPOSITORY" =~ $repository_name || "$REPOSITORY" == */. || "$REPOSITORY" == *..* ]]; then
            give_up "The name of the repository cannot name a directory."
          fi
          if [[ -z "${HOME:-}" || "$HOME" != /* || "$HOME" == *..* || ! -d "$HOME" ]]; then
            give_up "HOME is not a directory, so there is no place for the QA home."
          fi
          minutes="${BUILD_TIMEOUT_MINUTES%%.*}"
          if [[ ! "$minutes" =~ ^[0-9]{1,5}$ ]]; then
            give_up "build-timeout-minutes is not a number, so nothing says how long this build may have the QA home."
          fi
          root="$HOME/android-qa-gradle"
          base="$root/$REPOSITORY"
          home="$base/home"
          lock="$base/in-use"
          mark="$base/intact"
          # The name this build takes the home under (its run and the attempt
          # of the run come first), the time by which its job is over at the
          # latest, and the runner the job is on.
          token="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-$$-$RANDOM"
          now=$(date +%s)
          expires=$(( now + (10#$minutes + 1) * 60 + 600 ))
          runner="${RUNNER_NAME:-}"
          runner="${runner//[$'\n\r']/ }"

          # What GitHub is asked about the build that has the home: the jobs
          # of its run attempt, and whether every one of them that ran on its
          # runner is completed. Exit status 0 is "over". Anything else is
          # not a yes: a job that is not completed, a runner that no job of
          # the attempt names, more jobs than one answer lists, a request
          # that failed or a token that may not ask. One line says which.
          #
          # python3 -I: without -I Python would look for the modules it
          # imports in the work folder first.
          ask_github=$(cat <<'OVER'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api = (os.environ.get("GITHUB_API_URL") or "https://api.github.com").rstrip("/")
          run, attempt, runner = os.environ["HOLDER_RUN"], os.environ["HOLDER_ATTEMPT"], os.environ["HOLDER_RUNNER"]
          asked = f"run {run}, attempt {attempt}, runner {runner}"
          request = urllib.request.Request(
              f"{api}/repos/{os.environ['REPOSITORY']}/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ.get('TOKEN', '').strip()}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "asleep-ai-actions-android-ci",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  document = json.load(response)
          except urllib.error.HTTPError as error:
              print(f"GitHub did not say whether the job is over ({asked}): HTTP {error.code}.")
              sys.exit(1)
          except (OSError, ValueError) as error:
              print(f"GitHub could not be asked whether the job is over ({asked}): {str(error) or type(error).__name__}.")
              sys.exit(1)
          jobs = document.get("jobs") if isinstance(document, dict) else None
          if not isinstance(jobs, list) or document.get("total_count") != len(jobs):
              print(f"GitHub did not list every job of the run ({asked}).")
              sys.exit(1)
          held = [job for job in jobs if isinstance(job, dict) and job.get("runner_name") == runner]
          if not held:
              print(f"GitHub lists no job of the run on that runner ({asked}).")
              sys.exit(1)
          running = [job for job in held if job.get("status") != "completed"]
          if running:
              print(f"GitHub says the job is {running[0].get('status') or 'not completed'} ({asked}).")
              sys.exit(1)
          print(f"GitHub says the job is over, as {', '.join(str(job.get('conclusion')) for job in held)} ({asked}).")
          OVER
          )

          # A function that is asked "did it work" runs without errexit, so
          # each of these returns at its first failure itself.
          problem="The QA home could not be prepared; the reason is in the lines above."
          place() {
            local path
            for path in "$root" "${base%/*}" "$base"; do
              if [[ -L "$path" ]]; then
                problem="$path is a symbolic link, and the QA home is a directory of its own."
                return 1
              fi
            done
            mkdir -p "$base" || return 1
            chmod 700 "$root" || return 1
          }
          # 0: `in-use` names this build. 2: the name is taken, or the file
          # could not be made for another reason, which `claim_error` then
          # holds. 1: the file could not be written. The second line of the
          # file is the runner; a build of an earlier version of this
          # workflow reads the first line only.
          claim_error=""
          claim() {
            local mine="$base/claim-$token"
            if ! printf '%s %s\n%s\n' "$token" "$expires" "$runner" > "$mine"; then
              return 1
            fi
            if claim_error=$(ln "$mine" "$lock" 2>&1); then
              rm -f "$mine"
              return 0
            fi
            rm -f "$mine"
            return 2
          }
          # Whether GitHub says that the job of the build $1, on the runner
          # $2, is over. Not asked without a runner to ask about (a file that
          # an earlier version of this workflow wrote) or without a token.
          over() {
            local run rest answer
            run="${1%%-*}"
            rest="${1#*-}"
            if [[ -z "$2" || -z "${TOKEN:-}" ]]; then
              return 1
            fi
            if answer=$(HOLDER_RUN="$run" HOLDER_ATTEMPT="${rest%%-*}" HOLDER_RUNNER="$2" python3 -I -c "$ask_github" 2>&1); then
              echo "$answer"
              return 0
            fi
            echo "$answer"
            return 1
          }
          # 0: the home is this build's. 2: another build has it. 1: that
          # cannot be told, and `problem` says why. `holder` is the build
          # whose name was found there, and `held_until` the time in its
          # file.
          holder=""
          held_until=""
          take() {
            local seen holder_runner="" moved found result=0
            if [[ -d "$lock" ]]; then
              problem="$lock is a directory, and it is the file that names the build that has the QA home. Delete it on the host."
              return 1
            fi
            claim || result=$?
            if [[ "$result" != 2 ]]; then
              return "$result"
            fi
            seen=$(cat "$lock" 2> /dev/null) || seen=""
            if [[ -z "$seen" ]]; then
              # Given back between the two statements above, or never there.
              result=0
              claim || result=$?
              if [[ "$result" != 2 ]]; then
                return "$result"
              fi
              # Taken again in between, by a build whose name is read now. Or
              # there is no file, and what keeps this build from making it is
              # not that it exists.
              seen=$(cat "$lock" 2> /dev/null) || seen=""
              if [[ -z "$seen" && ! -e "$lock" && ! -L "$lock" ]]; then
                problem="$lock, the file that names the build that has the QA home, could not be made, and no other build has made it: ${claim_error:-the link failed without a message}."
                return 1
              fi
            fi
            { read -r holder held_until; IFS= read -r holder_runner; } <<< "$seen" || true
            if [[ ! "$holder" =~ ^[0-9]+-[0-9]+-[0-9]+-[0-9]+$ || ! "$held_until" =~ ^[0-9]{1,12}$ ]]; then
              holder=""
              held_until=""
              problem="$lock does not name a build of this workflow. Delete it on the host while no QA build of the repository runs."
              return 1
            fi
            if (( now <= 10#$held_until )) && ! over "$holder" "$holder_runner"; then
              return 2
            fi
            # The job of that build is over and the file is still there:
            # GitHub says so, or the time the job had is up with time to
            # spare. The job died, or it was stopped before its last steps.
            # The file is taken away in one step, so that one build takes the
            # home over and not two. A build that gets in between the two
            # statements finds the home without `intact`, as this one will.
            moved="$base/stale-$token"
            if ! mv "$lock" "$moved" 2> /dev/null; then
              holder=""
              held_until=""
              return 2
            fi
            found=$(cat "$moved" 2> /dev/null) || found=""
            if [[ "$found" != "$seen" ]]; then
              # Not the file that was read: another build took the home over
              # in between, and this is its name. Back it goes.
              ln "$moved" "$lock" 2> /dev/null || true
              rm -f "$moved"
              { read -r holder held_until; } <<< "$found" || true
              return 2
            fi
            rm -f "$moved"
            echo "Taking the QA home over from the build of run ${holder%%-*}, which did not give it back."
            result=0
            claim || result=$?
            if [[ "$result" == 2 ]]; then
              # Another build was quicker, and its name was not read.
              holder=""
              held_until=""
            fi
            return "$result"
          }
          # A time of the lock file as people read it. GNU date and the BSD
          # one take the seconds differently.
          clock() {
            date -u -d "@$1" '+%H:%M UTC' 2> /dev/null || date -u -r "$1" '+%H:%M UTC' 2> /dev/null || echo "$1 (seconds since 1970)"
          }
          # Moved away in one step and deleted after that: the path of the
          # home is free at once, however long the deleting takes. With
          # `give-back` the home is given back at that moment, so a job that
          # is killed while it deletes (a cancelled run has minutes for its
          # last steps) leaves nothing taken. What cannot be deleted is no
          # home any more; the next build tries again.
          discard() {
            local gone="$base/discarded-$token-$RANDOM"
            if [[ -e "$home" || -L "$home" ]]; then
              mv "$home" "$gone" || return 1
            fi
            if [[ "${1:-}" == give-back ]]; then
              rm -f "$lock"
            fi
            if [[ -e "$gone" || -L "$gone" ]] && ! rm -rf "$gone"; then
              echo "::warning title=QA Gradle home not deleted completely::The QA home was moved away, and not all of it could be deleted; the reason is in the lines above. No build uses it any more, and the next QA build on this host tries again. If this warning stays, delete $gone on the host."
            fi
          }
          # What a QA home holds besides its caches, in `extra`. Kept are
          # caches (what Gradle downloaded and what it derived from that),
          # wrapper (the Gradle distributions) and jdks (toolchains Gradle
          # downloaded). Not kept: everything else at the top, which is where
          # init scripts, a gradle.properties, daemon logs and heap dumps
          # are; the local build cache, which no build that signs reads or
          # writes; and what a Gradle distribution reads as configuration.
          list_extra() {
            local path
            extra=()
            while IFS= read -r -d '' path; do
              extra+=("$path")
            done < <(find "$1" -mindepth 1 -maxdepth 1 ! -name caches ! -name wrapper ! -name jdks -print0)
            for path in "$1"/caches/build-cache-* "$1"/wrapper/dists/*/*/*/init.d "$1"/wrapper/dists/*/*/*/gradle.properties; do
              if [[ -e "$path" || -L "$path" ]]; then
                extra+=("$path")
              fi
            done
          }
          # Deletes all of that, and fails when some of it is left. `removed`
          # is what was there.
          scrub() {
            removed=()
            list_extra "$1"
            if [[ "${#extra[@]}" == 0 ]]; then
              return 0
            fi
            removed=("${extra[@]}")
            rm -rf "${extra[@]}" || return 1
            list_extra "$1"
            [[ "${#extra[@]}" == 0 ]]
          }
          # The first symbolic link, in `link`, among the places where one
          # would bring another Gradle user home in: the top of the home and
          # one level down, two levels below caches (caches/modules-2/files-2.1
          # is the downloads), three below wrapper/dists (a distribution is
          # wrapper/dists/<name>/<hash>/<gradle>). These are also all the
          # directories list_extra looks into, so what scrub deletes is in
          # this home.
          find_link() {
            link=$(find "$1" -mindepth 1 -maxdepth 2 -type l -print -quit) || return 1
            if [[ -z "$link" && -d "$1/caches" ]]; then
              link=$(find "$1/caches" -mindepth 1 -maxdepth 2 -type l -print -quit) || return 1
            fi
            if [[ -z "$link" && -d "$1/wrapper/dists" ]]; then
              link=$(find "$1/wrapper/dists" -mindepth 1 -maxdepth 3 -type l -print -quit) || return 1
            fi
          }
          prepare() {
            local path names finished=false
            # What a discard could not delete, and what a build that was
            # killed in the moment it took the home left of that.
            if ! find "$base" -mindepth 1 -maxdepth 1 \( -name 'discarded-*' -o \( \( -name 'claim-*' -o -name 'stale-*' \) -mmin +60 \) \) -exec rm -rf {} +; then
              echo "::warning title=QA Gradle home leftovers::Not everything that an earlier build left next to the QA home could be deleted; the reason is in the lines above. It is no home and no build uses it, but it takes room: delete the discarded-* directories in $base on the host."
            fi
            if [[ -f "$mark" && ! -L "$mark" ]]; then
              finished=true
            fi
            rm -rf "$mark" || return 1
            if [[ -L "$home" ]]; then
              rm -f "$home" || return 1
              echo "::warning title=QA Gradle home discarded::$home was a symbolic link. The link is deleted, and the build starts with an empty QA home."
            elif [[ -d "$home" && "$finished" != true ]]; then
              discard || return 1
              echo "::warning title=QA Gradle home discarded::The build that had the QA home before${holder:+ (run ${holder%%-*})} did not finish in it: its job died or was killed before its last steps. Such a home is not used again, so this build starts with an empty one."
            elif [[ -d "$home" ]]; then
              find_link "$home" || return 1
              if [[ -n "$link" ]]; then
                discard || return 1
                echo "::warning title=QA Gradle home discarded::$link was a symbolic link: the QA home shares nothing with another Gradle user home. The build starts with an empty QA home."
              elif [[ "$GRADLE_HOME" == reset ]]; then
                discard || return 1
                echo "Discarded the QA home: gradle-home is reset."
              fi
            elif [[ -e "$home" ]]; then
              rm -f "$home" || return 1
            fi
            if [[ -d "$home" ]]; then
              echo "The QA home exists: earlier QA builds of $REPOSITORY left it."
            else
              echo "The QA home is new: this build fills it."
            fi
            mkdir -p "$home" || return 1
            chmod 700 "$home" || return 1
            scrub "$home" || return 1
            if [[ "${#removed[@]}" != 0 ]]; then
              names=$(for path in "${removed[@]}"; do echo "${path#"$home"/}"; done | LC_ALL=C sort | tr '\n' ' ')
              echo "::warning title=QA Gradle home held more than its caches::Deleted from the QA home before the build: ${names% }. The build before left nothing there but the caches, and no build has a reason to write there afterwards, so look for what did."
            fi
          }

          if ! place; then
            give_up "$problem"
          fi
          state=0
          take || state=$?
          if [[ "$state" == 2 ]]; then
            not_emptied=""
            if [[ "$GRADLE_HOME" == reset ]]; then
              not_emptied=" The home was not emptied: start the run again when that build has ended."
            fi
            how_long=""
            if [[ -n "$held_until" ]]; then
              how_long=" It is that build's until $(clock "$held_until") at the latest, and sooner when its job ends."
            fi
            echo "::notice title=QA Gradle home in use::Another QA build of $REPOSITORY has the QA home${holder:+ (run ${holder%%-*})}, and one build at a time uses it. The build is cold.$how_long$not_emptied"
            use_cold "the QA home is in use"
          elif [[ "$state" != 0 ]]; then
            give_up "$problem"
          fi
          # The home is this build's from here on, and the step after the
          # build is told so at once, before the home is made ready: a job
          # that is cancelled while this step deletes an old home then still
          # gives the home back. `warm`, which only the end of this step
          # writes, says whether the home was made ready and Gradle uses it.
          {
            echo "root=$root"
            echo "home=$home"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"
          # A home that could not be prepared is not used, and not left for
          # the next build as it is.
          if ! prepare; then
            if ! discard give-back; then
              problem="$problem $home could not be moved away either. It stays marked as in use, so QA builds on this host are cold until one of them takes it over, after the time this build has, and tries again. Or delete $base on the host."
            fi
            give_up "$problem"
          fi
          echo "GRADLE_USER_HOME=$home" >> "$GITHUB_ENV"
          echo "warm=true" >> "$GITHUB_OUTPUT"
          echo "Gradle user home: $home (the QA home of $REPOSITORY)"

      # For the wrapper validation and the job summary. The Actions cache is
      # off on every runner: nothing is restored into a build that signs, and
      # nothing it produced is saved for other builds to restore.
      - name: Set up Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Decode the keystore
        id: keystore
        uses: asleep-ai/actions/android-signing@android-ci/v1
        with:
          operation: decode
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write local.properties
        id: properties
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore-file }}
        run: |
          set -euo pipefail
          prepared="$RUNNER_TEMP/android-release.properties"
          if [[ -z "$KEYSTORE_FILE" || ! -f "$KEYSTORE_FILE" ]]; then
            echo "::error::The keystore was not decoded."
            exit 1
          fi
          # The path is written as it is: java.util.Properties would read a backslash as an escape.
          if [[ "$KEYSTORE_FILE" == *\\* ]]; then
            echo "::error::The keystore path contains a backslash, which local.properties cannot hold as written."
            exit 1
          fi
          rm -f local.properties
          (
            umask 077
            {
              printf 'KEYSTORE_FILE=%s\n' "$KEYSTORE_FILE"
              cat "$prepared"
            } > local.properties
          )
          rm -f "$prepared"
          echo "Wrote local.properties: $(wc -l < local.properties | tr -d ' ') entries."

      - name: Run Gradle
        id: build
        env:
          KIND: ${{ inputs.kind }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
          # Scoped to this step: Gradle reads GITHUB_ACTOR and GITHUB_TOKEN as
          # GitHub Packages credentials. The job token cannot read packages of
          # other repositories, so GIT_TOKEN wins when the caller has it.
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GIT_TOKEN != '' && 'GIT_TOKEN' || 'the job token (GIT_TOKEN did not reach this job)' }}
          # Only this step sees the token. Its presence is what turns the
          # mapping upload on in the caller's build. A QA build gets it only
          # when its caller asks for the upload.
          SENTRY_AUTH_TOKEN: ${{ inputs.sentry-upload && secrets.SENTRY_AUTH_TOKEN || '' }}
          RUNNER_KIND: ${{ runner.environment }}
          MAX_WORKERS: ${{ inputs.self-hosted-max-workers }}
          GRADLE_JVMARGS: ${{ inputs.self-hosted-gradle-jvmargs }}
          KOTLIN_DAEMON_JVMARGS: ${{ inputs.self-hosted-kotlin-daemon-jvmargs }}
        run: |
          set -euo pipefail
          # The task is one of two names, never a value a caller wrote, and the
          # kind one of four words.
          case "$KIND" in
            release|preview) task=ciRelease ;;
            qa|label) task=ciQa ;;
            *)
              echo "::error::kind is none of release, preview, qa and label."
              exit 1
              ;;
          esac
          # Memory settings as in android-pr-check-jobs.yml: a self-hosted
          # host has far more cores than a build has memory for.
          extra=()
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            if [[ -n "$MAX_WORKERS" ]]; then
              extra+=("--max-workers=$MAX_WORKERS")
            fi
            if [[ -n "$GRADLE_JVMARGS" ]]; then
              extra+=("-Dorg.gradle.jvmargs=$GRADLE_JVMARGS")
            fi
            if [[ -n "$KOTLIN_DAEMON_JVMARGS" ]]; then
              extra+=("-Pkotlin.daemon.jvmargs=$KOTLIN_DAEMON_JVMARGS")
            fi
          fi
          echo "GitHub Packages credentials for Gradle: GITHUB_ACTOR=$GITHUB_ACTOR, GITHUB_TOKEN from $TOKEN_SOURCE."
          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "SENTRY_AUTH_TOKEN is set for this step."
          else
            echo "SENTRY_AUTH_TOKEN is not set: the build uploads nothing to Sentry."
          fi
          echo "Task: $task. Kind: $KIND. Version: $VERSION_NAME ($VERSION_CODE). Gradle user home: $GRADLE_USER_HOME"
          # A build that is signed is built from its sources alone: no daemon
          # of an earlier build, no build cache entry from anywhere. The copy
          # in the temp directory is what gradle-log-verdict reads.
          #
          # That holds in the QA home too, which is why the two flags do not
          # depend on it. The work folder was empty, and no task output is
          # read from a cache or written to one: every task of the project
          # runs, and no value of local.properties ends up in the home inside
          # a cached output. What the QA home saves is the downloads (the
          # Gradle distribution, the dependencies), what Gradle derives from
          # them, and the compiled build scripts.
          #
          # -PciBuildKind says which of the four kinds the build is, for a
          # build that puts it into the name of the APK. A build that does not
          # read the property is not affected by it.
          set -f
          # shellcheck disable=SC2086 # word splitting is intended: the value is an argument list
          ./gradlew "$task" "-PciVersionName=$VERSION_NAME" "-PciVersionCode=$VERSION_CODE" "-PciBuildKind=$KIND" $GRADLE_ARGS \
            --no-daemon --no-build-cache ${extra[@]+"${extra[@]}"} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # The task leaves the APKs of the build under apk-directory: one, or
      # one per flavor. The work folder was empty before the checkout, so
      # every APK there was built by this job. Each has to carry the version
      # it was built for: a build that ignores -PciVersionName or
      # -PciVersionCode would otherwise be published under the wrong version.
      #
      # What the build left is the same on every runner, so a refusal of the
      # APKs themselves sets the output `refused`, and the job reports code: a
      # second cold build on the GitHub-hosted runner would end the same way.
      # A runner without the SDK tool is a failure of the runner, and is not.
      - name: Check the APKs
        id: apk
        env:
          KIND: ${{ inputs.kind }}
          APK_DIRECTORY: ${{ inputs.apk-directory }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          BUILD_TOOLS_VERSION: ${{ inputs.build-tools-version }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 1
          }
          case "$KIND" in
            qa)
              task=ciQa
              what="the QA build"
              ;;
            label)
              task=ciQa
              what="the label build"
              ;;
            preview)
              task=ciRelease
              what="the preview"
              ;;
            *)
              task=ciRelease
              what="the release"
              ;;
          esac
          if [[ -z "$APK_DIRECTORY" || "$APK_DIRECTORY" == -* || ! -d "$APK_DIRECTORY" ]]; then
            refuse "apk-directory ($APK_DIRECTORY) is not a directory after the build."
          fi
          apks=()
          while IFS= read -r found; do
            apks+=("$found")
          done < <(find "$APK_DIRECTORY" -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" == 0 ]]; then
            refuse "$task left no APK under $APK_DIRECTORY."
          fi
          # The APKs become assets of one release, which names them by file name.
          duplicates=$(for apk in "${apks[@]}"; do basename "$apk"; done | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            refuse "Several APKs under $APK_DIRECTORY share a file name: ${duplicates//$'\n'/, }. Give each flavor's APK its own name."
          fi
          # GitHub changes the name of an asset that holds other characters,
          # and the publish job finds the APKs of a release by their names.
          odd=$(for apk in "${apks[@]}"; do basename "$apk"; done | grep -Ev '^[A-Za-z0-9][A-Za-z0-9._-]*\.apk$' || true)
          if [[ -n "$odd" ]]; then
            refuse "APK file names may hold letters, digits and . _ - only, and these do not: ${odd//$'\n'/, }."
          fi

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/build-tools" ]]; then
            echo "::error::No Android SDK with build-tools: ANDROID_HOME and ANDROID_SDK_ROOT name none."
            exit 1
          fi
          if [[ -n "$BUILD_TOOLS_VERSION" ]]; then
            aapt2="$sdk/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          else
            aapt2=$( (find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 -type f || true) | sort -V | tail -1)
          fi
          if [[ -z "$aapt2" || ! -x "$aapt2" ]]; then
            echo "::error::aapt2 was not found under $sdk/build-tools${BUILD_TOOLS_VERSION:+ (version $BUILD_TOOLS_VERSION)}."
            exit 1
          fi

          name_pattern="versionName='([^']*)'"
          code_pattern="versionCode='([0-9]+)'"
          wrong=0
          for apk in "${apks[@]}"; do
            package=$("$aapt2" dump badging "$apk" | grep -m1 '^package: ' || true)
            built_name=""
            built_code=""
            if [[ "$package" =~ $name_pattern ]]; then
              built_name="${BASH_REMATCH[1]}"
            fi
            if [[ "$package" =~ $code_pattern ]]; then
              built_code="${BASH_REMATCH[1]}"
            fi
            echo "$apk: versionName=$built_name versionCode=$built_code"
            if [[ "$built_name" != "$VERSION_NAME" || "$built_code" != "$VERSION_CODE" ]]; then
              echo "::error::$apk is version $built_name ($built_code), and $what is $VERSION_NAME ($VERSION_CODE). The build has to take its version from -PciVersionName and -PciVersionCode."
              wrong=1
            fi
          done
          if [[ "$wrong" != 0 ]]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # One path per line. No path can be the closing line: each ends in .apk.
          {
            echo "paths<<android-release-apks"
            printf '%s\n' "${apks[@]}"
            echo "android-release-apks"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the APK signatures
        id: signature
        uses: asleep-ai/actions/android-signing@android-ci/v1
        with:
          operation: verify
          apk-file: ${{ steps.apk.outputs.paths }}
          expected-cert-sha256: ${{ inputs.expected-cert-sha256 }}
          build-tools-version: ${{ inputs.build-tools-version }}

      # A release keeps its artifact next to the GitHub Release. A QA build is
      # built on every push and its APK lives in the rolling pre-release, so
      # its artifact is only the way to the publish job: that job deletes it,
      # and one day is the shortest time GitHub keeps what it could not.
      - name: Upload the signed APKs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ (inputs.kind == 'qa' || inputs.kind == 'label') && 'qa' || 'release' }}-apk-${{ inputs.attempt }}
          path: ${{ steps.apk.outputs.paths }}
          retention-days: ${{ (inputs.kind == 'qa' || inputs.kind == 'label') && 1 || 90 }}
          if-no-files-found: error
          # A re-run of the job uploads under the same name.
          overwrite: true

      - name: Delete the keystore and local.properties
        if: ${{ always() }}
        uses: asleep-ai/actions/android-signing@android-ci/v1
        with:
          operation: cleanup
          keystore-file: ${{ steps.keystore.outputs.keystore-file }}
          paths: |
            local.properties
            ${{ runner.temp }}/android-release.properties

      # The build outputs hold the values of local.properties (generated
      # sources, the APK), and a self-hosted runner would keep them for the
      # jobs that follow. A cold Gradle user home is in the temp directory,
      # which the runner empties itself; the QA home is seen to below.
      - name: Empty the work folder again
        if: ${{ always() }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_KIND" != self-hosted ]]; then
            exit 0
          fi
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
            echo "Emptied $GITHUB_WORKSPACE."
          fi

      # Only after a build that took the QA home, which outlives the job. The
      # step gives the home back (it deletes `in-use`) in every case but two.
      # A home that could be neither tidied nor moved away stays taken, so
      # that no build uses it as it is. And after a Gradle run that was
      # cancelled (by a run of a later commit, by a person or by the timeout
      # of the job) the home stays taken for two more minutes: what Gradle
      # started may outlive this step, the runner ends it when the job ends,
      # and a build that got the home in between would share it with those
      # processes. The next build takes the home over when GitHub tells it
      # that this job is over, or when the two minutes are.
      #
      # This step is not what frees the home after a job that died: no step
      # of such a job runs. The step that chooses the home sees to that, by
      # asking GitHub. A build whose step that chose the home was stopped
      # before the home was ready (`warm` is not set) gives it back as it is.
      #
      # A Gradle run that did not succeed leaves a home that is not used
      # again: it is moved away and deleted, and the next QA build on this
      # host starts with an empty one. The failure may be the code's, and
      # then a good home is thrown away for one slow build; it may be the
      # home's (an entry that a killed build left half written can read like
      # a compile error), and then every build after it would fail the same
      # way. The two cannot be told apart here, and the verdict does not try:
      # a failure that reads as the code's is reported as code and no second
      # build follows. Running the failed jobs again builds from an empty
      # home, which settles it.
      #
      # After any other build the home is kept, with nothing in it but its
      # caches. What the step before the build deletes is deleted here as
      # well, so the logs of the build's daemon (its output as Gradle printed
      # it), a heap dump and whatever else the build wrote outside the caches
      # do not stay on the host. Then `intact` is put back, which is what lets
      # the next build use the home. A home that cannot be left like that is
      # discarded.
      #
      # Nothing is read from a place the build could have changed: the paths
      # and the name this build took the home under are outputs of the step
      # that chose it, not GRADLE_USER_HOME or HOME, which a build can set
      # for the steps after it. And nothing is touched unless `in-use` still
      # names this build. The step never fails.
      - name: Tidy or discard the QA Gradle home
        if: ${{ always() && steps.gradle-home.outputs.token != '' && steps.gradle-home.outputs.warm != 'false' }}
        env:
          QA_ROOT: ${{ steps.gradle-home.outputs.root }}
          QA_HOME: ${{ steps.gradle-home.outputs.home }}
          QA_TOKEN: ${{ steps.gradle-home.outputs.token }}
          QA_READY: ${{ steps.gradle-home.outputs.warm }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          root="$QA_ROOT"
          home="$QA_HOME"
          token="$QA_TOKEN"
          base="${home%/home}"
          lock="$base/in-use"
          mark="$base/intact"
          repository_name='^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$'
          if [[ "$root" != /*/android-qa-gradle || "$home" != "$root"/*/home || ! "${base#"$root"/}" =~ $repository_name || "$home" == *..* || -z "$token" ]]; then
            echo "::warning title=QA Gradle home left as it is::'$home' is not a QA home under '$root'."
            exit 0
          fi
          holder=""
          holder_runner=""
          { { read -r holder _; IFS= read -r holder_runner; } < "$lock"; } 2> /dev/null || true
          if [[ "$holder" != "$token" ]]; then
            echo "::warning title=QA Gradle home left as it is::The QA home is not this build's any more${holder:+: the build of run ${holder%%-*} has it}. The job ran past the time it had and a later build took the home over, or the file that names the build was deleted on the host. Nothing is deleted."
            exit 0
          fi
          if [[ "$QA_READY" != true ]]; then
            # Whatever state the home is in, it is marked as that: a home
            # whose preparing was begun has no `intact`, and the next build
            # discards it.
            rm -f "$lock"
            echo "The step that chose the QA home was stopped before the home was ready, and Gradle did not run in it. The home is given back as it is."
            exit 0
          fi
          if [[ ! -e "$home" && ! -L "$home" ]]; then
            rm -f "$lock"
            echo "The QA home is gone: it was deleted on the host. The next QA build starts with an empty one."
            exit 0
          fi

          # The next four are the functions of the step that chose the home,
          # word for word.

          # Moved away in one step and deleted after that: the path of the
          # home is free at once, however long the deleting takes. With
          # `give-back` the home is given back at that moment, so a job that
          # is killed while it deletes (a cancelled run has minutes for its
          # last steps) leaves nothing taken. What cannot be deleted is no
          # home any more; the next build tries again.
          discard() {
            local gone="$base/discarded-$token-$RANDOM"
            if [[ -e "$home" || -L "$home" ]]; then
              mv "$home" "$gone" || return 1
            fi
            if [[ "${1:-}" == give-back ]]; then
              rm -f "$lock"
            fi
            if [[ -e "$gone" || -L "$gone" ]] && ! rm -rf "$gone"; then
              echo "::warning title=QA Gradle home not deleted completely::The QA home was moved away, and not all of it could be deleted; the reason is in the lines above. No build uses it any more, and the next QA build on this host tries again. If this warning stays, delete $gone on the host."
            fi
          }
          # What a QA home holds besides its caches, in `extra`. Kept are
          # caches (what Gradle downloaded and what it derived from that),
          # wrapper (the Gradle distributions) and jdks (toolchains Gradle
          # downloaded). Not kept: everything else at the top, which is where
          # init scripts, a gradle.properties, daemon logs and heap dumps
          # are; the local build cache, which no build that signs reads or
          # writes; and what a Gradle distribution reads as configuration.
          list_extra() {
            local path
            extra=()
            while IFS= read -r -d '' path; do
              extra+=("$path")
            done < <(find "$1" -mindepth 1 -maxdepth 1 ! -name caches ! -name wrapper ! -name jdks -print0)
            for path in "$1"/caches/build-cache-* "$1"/wrapper/dists/*/*/*/init.d "$1"/wrapper/dists/*/*/*/gradle.properties; do
              if [[ -e "$path" || -L "$path" ]]; then
                extra+=("$path")
              fi
            done
          }
          # Deletes all of that, and fails when some of it is left. `removed`
          # is what was there.
          scrub() {
            removed=()
            list_extra "$1"
            if [[ "${#extra[@]}" == 0 ]]; then
              return 0
            fi
            removed=("${extra[@]}")
            rm -rf "${extra[@]}" || return 1
            list_extra "$1"
            [[ "${#extra[@]}" == 0 ]]
          }
          # The first symbolic link, in `link`, among the places where one
          # would bring another Gradle user home in: the top of the home and
          # one level down, two levels below caches (caches/modules-2/files-2.1
          # is the downloads), three below wrapper/dists (a distribution is
          # wrapper/dists/<name>/<hash>/<gradle>). These are also all the
          # directories list_extra looks into, so what scrub deletes is in
          # this home.
          find_link() {
            link=$(find "$1" -mindepth 1 -maxdepth 2 -type l -print -quit) || return 1
            if [[ -z "$link" && -d "$1/caches" ]]; then
              link=$(find "$1/caches" -mindepth 1 -maxdepth 2 -type l -print -quit) || return 1
            fi
            if [[ -z "$link" && -d "$1/wrapper/dists" ]]; then
              link=$(find "$1/wrapper/dists" -mindepth 1 -maxdepth 3 -type l -print -quit) || return 1
            fi
          }

          taken="It stays marked as in use, so QA builds on this host are cold until one of them takes it over, after the time this build had, and tries again. Or delete $base on the host."
          if [[ "$BUILD_OUTCOME" == cancelled ]]; then
            # The file is replaced in one step, with the time in it changed:
            # this job has two more minutes, not the rest of its timeout.
            # Before the deleting, which a job that is being cancelled may not
            # get to finish.
            briefly="$base/claim-$token"
            if printf '%s %s\n%s\n' "$token" "$(( $(date +%s) + 120 ))" "$holder_runner" > "$briefly" && mv -f "$briefly" "$lock"; then
              kept="It stays this build's until the job is over: the next QA build takes it over when GitHub says so, or two minutes from now."
            else
              rm -f "$briefly"
              kept="It stays this build's until the job is over: the next QA build takes it over when GitHub says so, or after the time this build had."
            fi
            if discard; then
              echo "::notice title=QA Gradle home discarded::The Gradle run in the QA home ended as $BUILD_OUTCOME, so the home is not used again: the next QA build on this host starts with an empty one and is as slow as a cold build. $kept"
            else
              echo "::warning title=QA Gradle home not discarded::The Gradle run in the QA home ended as $BUILD_OUTCOME, and $home could not be moved away; the reason is in the lines above. $kept That build discards it."
            fi
            exit 0
          fi
          if [[ "$BUILD_OUTCOME" == failure ]]; then
            if discard give-back; then
              echo "::notice title=QA Gradle home discarded::The Gradle run in the QA home ended as $BUILD_OUTCOME, so the home is not used again: the next QA build on this host starts with an empty one and is as slow as a cold build. If the failure is not the code's, run the failed jobs again."
            else
              echo "::warning title=QA Gradle home not discarded::The Gradle run in the QA home ended as $BUILD_OUTCOME, and $home could not be moved away; the reason is in the lines above. $taken"
            fi
            exit 0
          fi
          # A link that the build put there is not followed by what deletes:
          # the home goes as a whole.
          if [[ -L "$home" ]] || ! find_link "$home"; then
            link="$home"
          fi
          if [[ -z "$link" ]] && scrub "$home" && rm -rf "$mark" && : > "$mark"; then
            rm -f "$lock"
            if [[ "${#removed[@]}" != 0 ]]; then
              names=$(for path in "${removed[@]}"; do echo "${path#"$home"/}"; done | LC_ALL=C sort | tr '\n' ' ')
              echo "Deleted from the QA home, as after every build: ${names% }."
            fi
            echo "Kept the QA home for the next QA build, with nothing in it but its caches: $home"
          elif discard give-back; then
            echo "::warning title=QA Gradle home discarded::The QA home could not be left with nothing in it but its caches${link:+: $link is a symbolic link}. The home is not used again, and the next QA build on this host starts with an empty one."
          else
            echo "::warning title=QA Gradle home not discarded::The QA home could neither be tidied nor moved away; the reason is in the lines above. $taken"
          fi

      # The secrets check and the check of the plan are left out of
      # setup-outcome: a missing secret or an incomplete plan is reported as
      # code by the job output, because no other runner would have it.
      # job-status covers the steps after the build (the APK check, the
      # signature, the upload): when one of them fails, the verdict is infra,
      # which the job output turns into code when the APKs were refused.
      - name: Report the verdict
        id: verdict
        if: ${{ always() && steps.planned.outcome != 'failure' && steps.values.outcome != 'failure' }}
        uses: asleep-ai/actions/gradle-log-verdict@android-ci/v1
        with:
          log-file: ${{ runner.temp }}/gradle.log
          setup-outcome: >-
            ${{ steps.workspace.outcome }} ${{ steps.checkout.outcome }} ${{ steps.commit.outcome }}
            ${{ steps.java.outcome }} ${{ steps.gradle-home.outcome }} ${{ steps.gradle.outcome }}
            ${{ steps.keystore.outcome }} ${{ steps.properties.outcome }}
          build-outcome: ${{ steps.build.outcome }}
          job-status: ${{ job.status }}
