name: Android release build

# The build job of android-release.yml and of android-qa.yml. Each calls this
# file once on the runner it picked and, after an infrastructure failure on a
# self-hosted runner, once more on a GitHub-hosted runner. The job builds a
# release or preview tag with ./gradlew ciRelease, or a branch commit with
# ./gradlew ciQa (a QA build or a label build), signs with the caller's
# keystore, checks every APK the build left and uploads them as one artifact
# for the publish job.
#
# Every build starts from an emptied work folder and runs every task. A
# release or a preview also starts from an empty Gradle user home. A QA or
# label build on a self-hosted runner may use the QA home of its repository
# instead (gradle-home), a directory that only such builds use and that is
# kept between them: see the step that chooses the home.
#
# This file is internal to those two workflows: call them, not this one. The
# inputs are documented there and in android-ci/README.md.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on as JSON: a label array, or a quoted runner label such as "ubuntu-latest"'
        required: true
        type: string
      attempt:
        description: >-
          primary or fallback. Both calls share one workflow run, so the
          artifact with the signed APKs is named android-release-apk-<attempt>
          or android-qa-apk-<attempt>.
        required: true
        type: string
      kind:
        description: >-
          What is built: release or preview (a tag, with ciRelease), qa or
          label (a branch commit, with ciQa). The build gets it as
          -PciBuildKind. It also decides the name of the artifact and how long
          it is kept: 90 days for a release or preview, 1 day for a QA or
          label build, whose publish job deletes it.
        required: true
        type: string
      environment:
        description: 'Empty runs the job in no environment.'
        required: false
        type: string
        default: ''
      ref:
        description: >-
          What is checked out: refs/tags/<tag> for a release, the id of the
          commit for a QA build.
        required: true
        type: string
      sha:
        description: 'The commit the build was planned for.'
        required: true
        type: string
      sentry-upload:
        description: >-
          Whether the Gradle step gets SENTRY_AUTH_TOKEN, whose presence turns
          the mapping upload on in the caller's build.
        required: false
        type: boolean
        default: true
      version-name:
        required: true
        type: string
      version-code:
        required: true
        type: string
      java-version:
        required: true
        type: string
      java-distribution:
        required: true
        type: string
      checkout-submodules:
        required: true
        type: string
      local-properties-secrets:
        required: false
        type: string
        default: ''
      required-secrets:
        required: false
        type: string
        default: ''
      gradle-args:
        required: false
        type: string
        default: ''
      apk-directory:
        required: true
        type: string
      expected-cert-sha256:
        required: false
        type: string
        default: ''
      build-tools-version:
        required: false
        type: string
        default: ''
      build-timeout-minutes:
        required: true
        type: number
      gradle-home:
        description: >-
          cold, warm or reset. cold, the default: a Gradle user home of this
          job, empty at its start and gone at its end. warm: the QA home of
          the repository, which is kept between jobs. reset: that home,
          emptied first. Anything but cold is honoured only for kind qa or
          label, on a self-hosted runner, in a run that a push or a person
          started on the source branch or on release/<major>.x. Every other
          build is cold, whatever the value. android-release.yml does not
          pass it.
        required: false
        type: string
        default: cold
      source-branch:
        description: >-
          The branch releases are cut from; empty means the default branch of
          the repository. Read only to decide whether the run may use the QA
          home.
        required: false
        type: string
        default: ''
      self-hosted-max-workers:
        required: false
        type: string
        default: ''
      self-hosted-gradle-jvmargs:
        required: false
        type: string
        default: ''
      self-hosted-kotlin-daemon-jvmargs:
        required: false
        type: string
        default: ''
    outputs:
      verdict:
        description: >-
          pass, code or infra; empty when the job never reported (its runner
          went away). code also stands for a missing secret or variable and
          for APKs that cannot be released: another runner would end the same
          way. A Gradle run in the QA home that failed is infra, never code:
          a cold build may end otherwise.
        value: ${{ jobs.build.outputs.verdict }}

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    # The signing secrets are read from this environment when they are kept
    # there. Its protection rules (reviewers, allowed branches and tags) apply
    # to this job.
    environment: ${{ inputs.environment }}
    # No output of this job may hold text that could equal a secret: the runner
    # drops an output that contains the value of one, a key alias for instance.
    #
    # code without asking gradle-log-verdict in two cases, because another
    # runner would end the same way: a missing secret, and APKs the build left
    # that cannot be released as they are.
    #
    # code as well when the plan of the calling workflow passed something
    # empty: the same plan would pass it to the second build.
    #
    # Never code for a Gradle run that used the QA home and failed: the
    # failure may be the home's (a damaged entry reads like a compile error),
    # so it is reported as infra and the calling workflow builds again, cold,
    # on the GitHub-hosted runner. A failure of the code fails there too.
    outputs:
      verdict: ${{ (steps.planned.outcome == 'failure' || steps.values.outcome == 'failure' || steps.apk.outputs.refused == 'true') && 'code' || (steps.gradle-home.outputs.warm == 'true' && steps.verdict.outputs.verdict == 'code' && 'infra') || steps.verdict.outputs.verdict }}
    steps:
      # A self-hosted runner keeps its work folder between jobs, and the jobs
      # before this one may have built a pull request: files in the folder, git
      # hooks and git configuration are all theirs. Nothing of that is trusted
      # by a job that signs, so the folder is emptied before any other step
      # runs in it, and the checkout below is a fresh clone. A GitHub-hosted
      # runner starts empty.
      - name: Empty the work folder
        id: workspace
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_KIND" != self-hosted ]]; then
            echo "Not a self-hosted runner: the work folder is new."
            exit 0
          fi
          if [[ -z "${GITHUB_WORKSPACE:-}" || ! -d "$GITHUB_WORKSPACE" ]]; then
            echo "::error::GITHUB_WORKSPACE is not a directory."
            exit 1
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          echo "Emptied $GITHUB_WORKSPACE."

      # What the plan job of the calling workflow decided arrives as inputs.
      # An empty one means the runner dropped a job output there: it does that
      # to an output that contains the value of a secret, without failing the
      # job that set it. The build would then fail much later, on a version
      # Gradle cannot read, with nothing that names the reason.
      - name: Check what was planned
        id: planned
        env:
          KIND: ${{ inputs.kind }}
          REF: ${{ inputs.ref }}
          PLANNED_SHA: ${{ inputs.sha }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          missing=""
          for name in KIND REF PLANNED_SHA VERSION_NAME VERSION_CODE; do
            if [[ -z "${!name}" ]]; then
              missing="${missing:+$missing, }$name"
            fi
          done
          # A version name that ends in a hyphen or starts with one lost a part.
          if [[ -z "$missing" && ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+(-[a-z0-9]+)*\.[0-9]+)?$ ]]; then
            missing="part of VERSION_NAME ($VERSION_NAME)"
          fi
          if [[ -n "$missing" ]]; then
            echo "::error title=The plan is incomplete::Empty: $missing. The plan job passed, so the runner dropped an output: it does that to an output that contains the value of a secret. Look for a secret whose value is a short word or number."
            exit 1
          fi
          case "$KIND" in
            release|preview|qa|label) ;;
            *)
              echo "::error::kind is none of release, preview, qa and label."
              exit 1
              ;;
          esac
          echo "Planned: $KIND build $VERSION_NAME ($VERSION_CODE) of $REF at $PLANNED_SHA."

      # Before anything is checked out, so a build that cannot be made
      # stops here and names everything that is missing at once. The four
      # signing values are always needed; the caller lists the rest. A name is
      # looked up among the secrets and then among the variables this job can
      # read. Only names are printed, never a value.
      #
      # The values that go to local.properties are written here, to a file in
      # the job's temp directory, so that this is the only step that sees
      # every secret. The step that needs the file moves it into place.
      #
      # python3 -I: the script comes from standard input, and without -I
      # Python would look for the modules it imports in the work folder first.
      - name: Check the secrets and variables
        id: values
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
          LOCAL_PROPERTIES_SECRETS: ${{ inputs.local-properties-secrets }}
          REQUIRED_SECRETS: ${{ inputs.required-secrets }}
        run: |
          set -euo pipefail
          python3 -I - <<'VALUES'
          import json
          import os
          import re
          import sys

          SIGNING = ["KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"]
          # KEYSTORE_FILE is the path of the decoded keystore, which a later step writes.
          RESERVED = set(SIGNING) | {"KEYSTORE_FILE"}
          NAME = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")


          def names(variable):
              return os.environ.get(variable, "").replace(",", " ").split()


          def escape(value):
              # java.util.Properties reads the file as ISO-8859-1, takes a backslash as the start of
              # an escape and drops the whitespace a value starts with. Written this way, the build
              # reads back exactly the value that was stored.
              escaped = []
              for index, character in enumerate(value):
                  if character == "\\":
                      escaped.append("\\\\")
                  elif character in "\n\r\t\f":
                      escaped.append({"\n": "\\n", "\r": "\\r", "\t": "\\t", "\f": "\\f"}[character])
                  elif character == " " and index == 0:
                      escaped.append("\\ ")
                  elif " " <= character <= "~":
                      escaped.append(character)
                  else:
                      code = character.encode("utf-16-be").hex()
                      escaped.append("".join("\\u" + code[i:i + 4] for i in range(0, len(code), 4)))
              return "".join(escaped)


          secrets = json.loads(os.environ.get("SECRETS_JSON") or "{}")
          variables = json.loads(os.environ.get("VARS_JSON") or "{}")
          listed = names("LOCAL_PROPERTIES_SECRETS")
          required = names("REQUIRED_SECRETS")

          invalid = [name for name in listed + required if not NAME.fullmatch(name)]
          if invalid:
              # A value pasted where a name belongs must not reach the log.
              print(f"::error title=Invalid input::{len(invalid)} entr{'y is' if len(invalid) == 1 else 'ies are'} "
                    "not the name of a secret or variable. local-properties-secrets and required-secrets take "
                    "names, separated by whitespace or commas.")
              sys.exit(1)
          reserved = sorted(set(listed) & RESERVED)
          if reserved:
              print(f"::error title=Invalid input::local-properties-secrets lists {', '.join(reserved)}, which this "
                    "workflow writes itself.")
              sys.exit(1)


          def value(name):
              found = secrets.get(name) or variables.get(name) or ""
              return found if isinstance(found, str) else ""


          wanted = list(dict.fromkeys(SIGNING + listed + required))
          missing = [name for name in wanted if not value(name)]
          if missing:
              print(f"::error title=Missing secrets or variables::{', '.join(missing)}. Each has to be a secret or a "
                    "variable of the repository, its organization or the environment of this job, and the calling "
                    "workflow has to pass its secrets with `secrets: inherit`.")
              sys.exit(1)

          written = ["KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"] + list(dict.fromkeys(listed))
          path = os.path.join(os.environ["RUNNER_TEMP"], "android-release.properties")
          try:
              os.unlink(path)
          except FileNotFoundError:
              pass
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w", encoding="ascii") as file:
              for name in written:
                  file.write(f"{name}={escape(value(name))}\n")
          print(f"All {len(wanted)} values are present: {', '.join(wanted)}.")
          print(f"Prepared {len(written)} local.properties entries: {', '.join(written)}.")
          VALUES

      # GIT_TOKEN is used only when submodules are checked out: it reaches
      # private ones, and the job token reads the repository itself. No token
      # stays in the clone.
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.ref }}
          token: ${{ inputs.checkout-submodules != 'false' && secrets.GIT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout-submodules }}
          persist-credentials: false

      # The version and the build were planned for one commit. A tag that
      # was moved since then is another release.
      - name: Check the commit
        id: commit
        env:
          REF: ${{ inputs.ref }}
          PLANNED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [[ "$head" != "$PLANNED_SHA" ]]; then
            echo "::error::$REF is at $head, and this build was planned for $PLANNED_SHA. The ref was moved; start the run again."
            exit 1
          fi
          echo "Building $REF at $head."

      - name: Set up the JDK
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      # Cold, for every release and preview and wherever nothing else is asked
      # for: a Gradle user home in the job's temp directory, which the runner
      # empties before and after every job. It starts without init scripts,
      # dependency cache, build cache or daemons of any other job, and what
      # this build leaves in it, values of local.properties included, is gone
      # when the job ends.
      #
      # Warm, for a QA or label build that asks for it (gradle-home): the QA
      # home of the repository, <HOME>/android-qa-gradle/<owner>/<repo>/home,
      # a directory of the runner's user that no other step of these
      # workflows names. It is kept between jobs, so a build finds the Gradle
      # distribution, the dependencies and what Gradle derived from them
      # already there.
      #
      # Who may use it is decided here, from the run itself and not from what
      # a caller says: a QA or label build, on a self-hosted runner, in a run
      # that a push or a person started on the source branch or on
      # release/<major>.x. Those are the builds of merged code that are signed
      # anyway. Every other build is cold whatever was asked for: a release,
      # a preview, a GitHub-hosted runner, any other event, any other ref.
      #
      # One home per repository, for all its lines and for every runner of a
      # host that runs as the same user: the same path on each of them, as
      # ~/.gradle is for the pull request builds. Gradle guards a user home
      # that several builds use at once with file locks. The pull request
      # builds never use this directory, and this build never uses theirs.
      #
      # The home holds caches, never configuration. Init scripts, a
      # gradle.properties and daemon logs found in it are deleted before the
      # build; setup-gradle writes its own init scripts (gradle-actions.*) in
      # the next step, and those stay, because a build on another runner may
      # be reading them. A symbolic link in place of the home or directly
      # inside it, which is how another home would get back in, ends in an
      # empty home. So does gradle-home reset.
      #
      # Nothing about the QA home fails the step: whatever keeps it from
      # being used ends in a cold build and a warning.
      - name: Choose the Gradle user home
        id: gradle-home
        env:
          GRADLE_HOME: ${{ inputs.gradle-home }}
          KIND: ${{ inputs.kind }}
          RUNNER_KIND: ${{ runner.environment }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          SOURCE_BRANCH: ${{ inputs.source-branch || github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cold="$RUNNER_TEMP/gradle-user-home"
          rm -rf "$cold"
          use_cold() {
            mkdir -p "$cold"
            echo "GRADLE_USER_HOME=$cold" >> "$GITHUB_ENV"
            echo "warm=false" >> "$GITHUB_OUTPUT"
            echo "Gradle user home: $cold (cold: $1)"
            exit 0
          }
          # The build was meant to be warm and is not: the host has to hear of it.
          give_up() {
            echo "::warning title=QA Gradle home not used::$1 The build is cold."
            use_cold "the QA home cannot be used"
          }

          case "$GRADLE_HOME" in
            warm|reset) ;;
            cold) use_cold "gradle-home is cold" ;;
            *) give_up "gradle-home is none of cold, warm and reset." ;;
          esac
          if [[ "$KIND" != qa && "$KIND" != label ]]; then
            use_cold "a release or a preview is built cold, whatever gradle-home says"
          fi
          if [[ "$RUNNER_KIND" != self-hosted ]]; then
            use_cold "a GitHub-hosted runner keeps nothing between jobs"
          fi
          if [[ "$EVENT_NAME" != push && "$EVENT_NAME" != workflow_dispatch ]]; then
            use_cold "only a run that a push or a person started uses the QA home, and this is a $EVENT_NAME run"
          fi
          release_line='^release/(0|[1-9][0-9]*)\.x$'
          branch="${RUN_REF#refs/heads/}"
          if [[ "$RUN_REF" != refs/heads/* || -z "$SOURCE_BRANCH" ]] || [[ "$branch" != "$SOURCE_BRANCH" && ! "$branch" =~ $release_line ]]; then
            use_cold "only a run on the source branch or on release/<major>.x uses the QA home, and this run is on $RUN_REF"
          fi

          # <owner>/<repo>, as two directories: no two repositories share a path.
          repository_name='^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$'
          if [[ ! "$REPOSITORY" =~ $repository_name || "$REPOSITORY" == */. || "$REPOSITORY" == */.. ]]; then
            give_up "The name of the repository cannot name a directory."
          fi
          if [[ -z "${HOME:-}" || "$HOME" != /* || ! -d "$HOME" ]]; then
            give_up "HOME is not a directory, so there is no place for the QA home."
          fi
          root="$HOME/android-qa-gradle"
          base="$root/$REPOSITORY"
          home="$base/home"

          # Moved away in one step and deleted after that: a build that starts
          # meanwhile finds no home and makes its own, never half of one.
          discard() {
            local gone="$base/discarded-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-$$"
            mv "$home" "$gone" || return 1
            rm -rf "$gone" || return 1
          }
          # A function that is asked "did it work" runs without errexit, so
          # it returns at its first failure itself.
          problem="The QA home could not be prepared; the reason is in the lines above."
          prepare() {
            local path names
            for path in "$root" "${base%/*}" "$base"; do
              if [[ -L "$path" ]]; then
                problem="$path is a symbolic link, and the QA home is a directory of its own."
                return 1
              fi
            done
            mkdir -p "$base" || return 1
            chmod 700 "$root" || return 1
            # What a discard that was interrupted left behind.
            find "$base" -mindepth 1 -maxdepth 1 -name 'discarded-*' -exec rm -rf {} + \
              || echo "Could not delete everything an earlier discard left in $base. The next build tries again."
            if [[ -L "$home" ]]; then
              rm -f "$home" || return 1
              echo "::warning title=QA Gradle home discarded::$home was a symbolic link. The link is deleted, and the build starts with an empty QA home."
            elif [[ -d "$home" ]]; then
              path=$(find "$home" -mindepth 1 -maxdepth 1 -type l -print -quit) || return 1
              if [[ -n "$path" ]]; then
                discard || return 1
                echo "::warning title=QA Gradle home discarded::$path was a symbolic link: the QA home shares nothing with another Gradle user home. The build starts with an empty QA home."
              elif [[ "$GRADLE_HOME" == reset ]]; then
                discard || return 1
                echo "Discarded the QA home: gradle-home is reset."
              fi
            elif [[ -e "$home" ]]; then
              rm -f "$home" || return 1
            fi
            if [[ -d "$home" ]]; then
              echo "The QA home exists: earlier QA builds of $REPOSITORY left it."
            else
              echo "The QA home is new: this build fills it."
            fi
            mkdir -p "$home" || return 1
            chmod 700 "$home" || return 1

            stray=()
            for path in "$home/init.gradle" "$home/init.gradle.kts" "$home/gradle.properties"; do
              if [[ -e "$path" ]]; then
                stray+=("$path")
              fi
            done
            if [[ -d "$home/init.d" ]]; then
              while IFS= read -r path; do
                stray+=("$path")
              done < <(find "$home/init.d" -mindepth 1 -maxdepth 1 ! -name 'gradle-actions.*')
            fi
            if [[ "${#stray[@]}" != 0 ]]; then
              rm -rf "${stray[@]}" || return 1
              names=$(for path in "${stray[@]}"; do echo "${path#"$home"/}"; done | sort | tr '\n' ' ')
              echo "::warning title=QA Gradle home held configuration::Deleted from the QA home before the build: ${names% }. The build before deletes them at its end and a build has no reason to write them, so look for what did."
            fi
            if [[ -d "$home/daemon" ]]; then
              find "$home/daemon" -type f -name '*.log' -delete || return 1
            fi
          }
          if ! prepare; then
            give_up "$problem"
          fi
          echo "GRADLE_USER_HOME=$home" >> "$GITHUB_ENV"
          {
            echo "warm=true"
            echo "home=$home"
          } >> "$GITHUB_OUTPUT"
          echo "Gradle user home: $home (the QA home of $REPOSITORY)"

      # For the wrapper validation and the job summary. The Actions cache is
      # off on every runner: nothing is restored into a build that signs, and
      # nothing it produced is saved for other builds to restore.
      - name: Set up Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Decode the keystore
        id: keystore
        uses: asleep-ai/actions/android-signing@android-ci/v1
        with:
          operation: decode
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write local.properties
        id: properties
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore-file }}
        run: |
          set -euo pipefail
          prepared="$RUNNER_TEMP/android-release.properties"
          if [[ -z "$KEYSTORE_FILE" || ! -f "$KEYSTORE_FILE" ]]; then
            echo "::error::The keystore was not decoded."
            exit 1
          fi
          # The path is written as it is: java.util.Properties would read a backslash as an escape.
          if [[ "$KEYSTORE_FILE" == *\\* ]]; then
            echo "::error::The keystore path contains a backslash, which local.properties cannot hold as written."
            exit 1
          fi
          rm -f local.properties
          (
            umask 077
            {
              printf 'KEYSTORE_FILE=%s\n' "$KEYSTORE_FILE"
              cat "$prepared"
            } > local.properties
          )
          rm -f "$prepared"
          echo "Wrote local.properties: $(wc -l < local.properties | tr -d ' ') entries."

      - name: Run Gradle
        id: build
        env:
          KIND: ${{ inputs.kind }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          GRADLE_ARGS: ${{ inputs.gradle-args }}
          # Scoped to this step: Gradle reads GITHUB_ACTOR and GITHUB_TOKEN as
          # GitHub Packages credentials. The job token cannot read packages of
          # other repositories, so GIT_TOKEN wins when the caller has it.
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.GIT_TOKEN != '' && 'GIT_TOKEN' || 'the job token (GIT_TOKEN did not reach this job)' }}
          # Only this step sees the token. Its presence is what turns the
          # mapping upload on in the caller's build. A QA build gets it only
          # when its caller asks for the upload.
          SENTRY_AUTH_TOKEN: ${{ inputs.sentry-upload && secrets.SENTRY_AUTH_TOKEN || '' }}
          RUNNER_KIND: ${{ runner.environment }}
          MAX_WORKERS: ${{ inputs.self-hosted-max-workers }}
          GRADLE_JVMARGS: ${{ inputs.self-hosted-gradle-jvmargs }}
          KOTLIN_DAEMON_JVMARGS: ${{ inputs.self-hosted-kotlin-daemon-jvmargs }}
        run: |
          set -euo pipefail
          # The task is one of two names, never a value a caller wrote, and the
          # kind one of four words.
          case "$KIND" in
            release|preview) task=ciRelease ;;
            qa|label) task=ciQa ;;
            *)
              echo "::error::kind is none of release, preview, qa and label."
              exit 1
              ;;
          esac
          # Memory settings as in android-pr-check-jobs.yml: a self-hosted
          # host has far more cores than a build has memory for.
          extra=()
          if [[ "$RUNNER_KIND" == self-hosted ]]; then
            if [[ -n "$MAX_WORKERS" ]]; then
              extra+=("--max-workers=$MAX_WORKERS")
            fi
            if [[ -n "$GRADLE_JVMARGS" ]]; then
              extra+=("-Dorg.gradle.jvmargs=$GRADLE_JVMARGS")
            fi
            if [[ -n "$KOTLIN_DAEMON_JVMARGS" ]]; then
              extra+=("-Pkotlin.daemon.jvmargs=$KOTLIN_DAEMON_JVMARGS")
            fi
          fi
          echo "GitHub Packages credentials for Gradle: GITHUB_ACTOR=$GITHUB_ACTOR, GITHUB_TOKEN from $TOKEN_SOURCE."
          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "SENTRY_AUTH_TOKEN is set for this step."
          else
            echo "SENTRY_AUTH_TOKEN is not set: the build uploads nothing to Sentry."
          fi
          echo "Task: $task. Kind: $KIND. Version: $VERSION_NAME ($VERSION_CODE). Gradle user home: $GRADLE_USER_HOME"
          # A build that is signed is built from its sources alone: no daemon
          # of an earlier build, no build cache entry from anywhere. The copy
          # in the temp directory is what gradle-log-verdict reads.
          #
          # That holds in the QA home too, which is why the two flags do not
          # depend on it. The work folder was empty, and no task output is
          # read from a cache or written to one: every task of the project
          # runs, and no value of local.properties ends up in the home inside
          # a cached output. What the QA home saves is the downloads (the
          # Gradle distribution, the dependencies), what Gradle derives from
          # them, and the compiled build scripts.
          #
          # -PciBuildKind says which of the four kinds the build is, for a
          # build that puts it into the name of the APK. A build that does not
          # read the property is not affected by it.
          set -f
          # shellcheck disable=SC2086 # word splitting is intended: the value is an argument list
          ./gradlew "$task" "-PciVersionName=$VERSION_NAME" "-PciVersionCode=$VERSION_CODE" "-PciBuildKind=$KIND" $GRADLE_ARGS \
            --no-daemon --no-build-cache ${extra[@]+"${extra[@]}"} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # The task leaves the APKs of the build under apk-directory: one, or
      # one per flavor. The work folder was empty before the checkout, so
      # every APK there was built by this job. Each has to carry the version
      # it was built for: a build that ignores -PciVersionName or
      # -PciVersionCode would otherwise be published under the wrong version.
      #
      # What the build left is the same on every runner, so a refusal of the
      # APKs themselves sets the output `refused`, and the job reports code: a
      # second cold build on the GitHub-hosted runner would end the same way.
      # A runner without the SDK tool is a failure of the runner, and is not.
      - name: Check the APKs
        id: apk
        env:
          KIND: ${{ inputs.kind }}
          APK_DIRECTORY: ${{ inputs.apk-directory }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          BUILD_TOOLS_VERSION: ${{ inputs.build-tools-version }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 1
          }
          case "$KIND" in
            qa)
              task=ciQa
              what="the QA build"
              ;;
            label)
              task=ciQa
              what="the label build"
              ;;
            preview)
              task=ciRelease
              what="the preview"
              ;;
            *)
              task=ciRelease
              what="the release"
              ;;
          esac
          if [[ -z "$APK_DIRECTORY" || "$APK_DIRECTORY" == -* || ! -d "$APK_DIRECTORY" ]]; then
            refuse "apk-directory ($APK_DIRECTORY) is not a directory after the build."
          fi
          apks=()
          while IFS= read -r found; do
            apks+=("$found")
          done < <(find "$APK_DIRECTORY" -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" == 0 ]]; then
            refuse "$task left no APK under $APK_DIRECTORY."
          fi
          # The APKs become assets of one release, which names them by file name.
          duplicates=$(for apk in "${apks[@]}"; do basename "$apk"; done | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            refuse "Several APKs under $APK_DIRECTORY share a file name: ${duplicates//$'\n'/, }. Give each flavor's APK its own name."
          fi
          # GitHub changes the name of an asset that holds other characters,
          # and the publish job finds the APKs of a release by their names.
          odd=$(for apk in "${apks[@]}"; do basename "$apk"; done | grep -Ev '^[A-Za-z0-9][A-Za-z0-9._-]*\.apk$' || true)
          if [[ -n "$odd" ]]; then
            refuse "APK file names may hold letters, digits and . _ - only, and these do not: ${odd//$'\n'/, }."
          fi

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/build-tools" ]]; then
            echo "::error::No Android SDK with build-tools: ANDROID_HOME and ANDROID_SDK_ROOT name none."
            exit 1
          fi
          if [[ -n "$BUILD_TOOLS_VERSION" ]]; then
            aapt2="$sdk/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          else
            aapt2=$( (find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 -type f || true) | sort -V | tail -1)
          fi
          if [[ -z "$aapt2" || ! -x "$aapt2" ]]; then
            echo "::error::aapt2 was not found under $sdk/build-tools${BUILD_TOOLS_VERSION:+ (version $BUILD_TOOLS_VERSION)}."
            exit 1
          fi

          name_pattern="versionName='([^']*)'"
          code_pattern="versionCode='([0-9]+)'"
          wrong=0
          for apk in "${apks[@]}"; do
            package=$("$aapt2" dump badging "$apk" | grep -m1 '^package: ' || true)
            built_name=""
            built_code=""
            if [[ "$package" =~ $name_pattern ]]; then
              built_name="${BASH_REMATCH[1]}"
            fi
            if [[ "$package" =~ $code_pattern ]]; then
              built_code="${BASH_REMATCH[1]}"
            fi
            echo "$apk: versionName=$built_name versionCode=$built_code"
            if [[ "$built_name" != "$VERSION_NAME" || "$built_code" != "$VERSION_CODE" ]]; then
              echo "::error::$apk is version $built_name ($built_code), and $what is $VERSION_NAME ($VERSION_CODE). The build has to take its version from -PciVersionName and -PciVersionCode."
              wrong=1
            fi
          done
          if [[ "$wrong" != 0 ]]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # One path per line. No path can be the closing line: each ends in .apk.
          {
            echo "paths<<android-release-apks"
            printf '%s\n' "${apks[@]}"
            echo "android-release-apks"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the APK signatures
        id: signature
        uses: asleep-ai/actions/android-signing@android-ci/v1
        with:
          operation: verify
          apk-file: ${{ steps.apk.outputs.paths }}
          expected-cert-sha256: ${{ inputs.expected-cert-sha256 }}
          build-tools-version: ${{ inputs.build-tools-version }}

      # A release keeps its artifact next to the GitHub Release. A QA build is
      # built on every push and its APK lives in the rolling pre-release, so
      # its artifact is only the way to the publish job: that job deletes it,
      # and one day is the shortest time GitHub keeps what it could not.
      - name: Upload the signed APKs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ (inputs.kind == 'qa' || inputs.kind == 'label') && 'qa' || 'release' }}-apk-${{ inputs.attempt }}
          path: ${{ steps.apk.outputs.paths }}
          retention-days: ${{ (inputs.kind == 'qa' || inputs.kind == 'label') && 1 || 90 }}
          if-no-files-found: error
          # A re-run of the job uploads under the same name.
          overwrite: true

      - name: Delete the keystore and local.properties
        if: ${{ always() }}
        uses: asleep-ai/actions/android-signing@android-ci/v1
        with:
          operation: cleanup
          keystore-file: ${{ steps.keystore.outputs.keystore-file }}
          paths: |
            local.properties
            ${{ runner.temp }}/android-release.properties

      # The build outputs hold the values of local.properties (generated
      # sources, the APK), and a self-hosted runner would keep them for the
      # jobs that follow. A cold Gradle user home is in the temp directory,
      # which the runner empties itself; the QA home is seen to below.
      - name: Empty the work folder again
        if: ${{ always() }}
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_KIND" != self-hosted ]]; then
            exit 0
          fi
          if [[ -n "${GITHUB_WORKSPACE:-}" && -d "$GITHUB_WORKSPACE" ]]; then
            find "$GITHUB_WORKSPACE" -mindepth 1 -delete
            echo "Emptied $GITHUB_WORKSPACE."
          fi

      # Only after a build in the QA home, which outlives the job.
      #
      # A Gradle run that did not succeed there leaves a home that is not
      # used again: it is moved away and deleted, and the next QA build on
      # this host starts with an empty one. The failure may be the code's,
      # and then a good home is thrown away for one slow build; it may be the
      # home's (an entry that a killed build left half written), and then
      # every build after it would fail the same way. The two cannot be told
      # apart here. A build on another runner of the host that is using the
      # home at that moment loses it and fails over to the GitHub-hosted
      # runner as well.
      #
      # After any other build the home is kept, without what is not a cache:
      # the logs of the build's daemon, which hold its output as Gradle
      # printed it, and configuration (init scripts but setup-gradle's, a
      # gradle.properties), should the build have left any.
      #
      # The path is the output of the step that chose the home, not
      # GRADLE_USER_HOME: the build ran in between and can write to the
      # file that sets the variables of later steps. The step never fails: a
      # home it could not see to is discarded or tidied by the next build.
      - name: Tidy or discard the QA Gradle home
        if: ${{ always() && steps.gradle-home.outputs.warm == 'true' }}
        env:
          QA_HOME: ${{ steps.gradle-home.outputs.home }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          root="${HOME:-}/android-qa-gradle"
          if [[ -z "${HOME:-}" || "$QA_HOME" != "$root"/*/home || "$QA_HOME" == *..* || -L "$QA_HOME" ]]; then
            echo "::warning title=QA Gradle home left as it is::'$QA_HOME' is not a QA home under $root."
            exit 0
          fi
          if [[ ! -d "$QA_HOME" ]]; then
            echo "The QA home is gone: another build discarded it."
            exit 0
          fi
          base="${QA_HOME%/home}"
          if [[ "$BUILD_OUTCOME" == failure || "$BUILD_OUTCOME" == cancelled ]]; then
            gone="$base/discarded-${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-$$"
            if mv "$QA_HOME" "$gone" && rm -rf "$gone"; then
              echo "::notice title=QA Gradle home discarded::The Gradle run in the QA home ended as $BUILD_OUTCOME, so the home is not used again. The next QA build on this host starts with an empty one and is as slow as a cold build."
            else
              echo "::warning title=QA Gradle home not discarded::The Gradle run in the QA home ended as $BUILD_OUTCOME, and $QA_HOME could not be moved away and deleted. Delete $base on the host."
            fi
            exit 0
          fi
          tidy() {
            rm -rf "$QA_HOME/init.gradle" "$QA_HOME/init.gradle.kts" "$QA_HOME/gradle.properties" || return 1
            if [[ -d "$QA_HOME/init.d" ]]; then
              find "$QA_HOME/init.d" -mindepth 1 -maxdepth 1 ! -name 'gradle-actions.*' -exec rm -rf {} + || return 1
            fi
            if [[ -d "$QA_HOME/daemon" ]]; then
              find "$QA_HOME/daemon" -type f -name '*.log' -delete || return 1
            fi
          }
          if tidy; then
            echo "Kept the QA home for the next QA build, without daemon logs and configuration: $QA_HOME"
          else
            echo "::warning title=QA Gradle home not tidied::Could not delete the daemon logs or the configuration in $QA_HOME; the reason is in the lines above. The next QA build deletes them before it starts."
          fi

      # The secrets check and the check of the plan are left out of
      # setup-outcome: a missing secret or an incomplete plan is reported as
      # code by the job output, because no other runner would have it.
      # job-status covers the steps after the build (the APK check, the
      # signature, the upload): when one of them fails, the verdict is infra,
      # which the job output turns into code when the APKs were refused. The
      # job output also turns a code verdict of a Gradle run in the QA home
      # into infra; the log line of this step still says what the log said.
      - name: Report the verdict
        id: verdict
        if: ${{ always() && steps.planned.outcome != 'failure' && steps.values.outcome != 'failure' }}
        uses: asleep-ai/actions/gradle-log-verdict@android-ci/v1
        with:
          log-file: ${{ runner.temp }}/gradle.log
          setup-outcome: >-
            ${{ steps.workspace.outcome }} ${{ steps.checkout.outcome }} ${{ steps.commit.outcome }}
            ${{ steps.java.outcome }} ${{ steps.gradle-home.outcome }} ${{ steps.gradle.outcome }}
            ${{ steps.keystore.outcome }} ${{ steps.properties.outcome }}
          build-outcome: ${{ steps.build.outcome }}
          job-status: ${{ job.status }}
