name: Release

on:
  push:
    tags: ['*/v*.*.*']  # single-segment prefixes only (this repo's actions are root-level)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Dogfood: this repo drafts its own release notes with its own action,
      # referenced in-tree (`./release-notes`) so the workflow always exercises
      # the committed version rather than a published tag.
      - uses: ./release-notes
        id: notes
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          # Idempotent: on a re-run the release already exists -- refresh its
          # notes instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            exit 0
          fi
          # gh does not infer prerelease from the tag name, so mark non-stable
          # shapes (e.g. `.../v1.0.0-rc.1`) explicitly -- otherwise an RC can be
          # published as "Latest".
          flags=()
          [[ "$GITHUB_REF_NAME" =~ ^[^/]+/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            "${flags[@]}"
